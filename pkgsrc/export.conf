# EmberBSD pkgsrc export. scripts/prepare-pkgsrc.sh reads this file.
# Fields are separated by one tab. Paths are relative to the repository root.
#
#   recipe        SOURCE  PKGPATH       Export a recipe that is not in pkgsrc/.
#   patch         FILE                  Apply an infrastructure patch with patch -p1.
#   git-apply     FILE    MANIFEST      Apply a patch with binary files with git apply.
#                                       MANIFEST records its SHA-256 checksum.
#   recipe-patch  FILE    PKGPATH NAME  Add FILE to the recipe as patches/NAME.
#   file          FILE    DESTINATION   Copy a file into the export.
#
# The export installs the recipes first, then applies the patches in this
# order, then copies the files. An exported recipe that has the path of an
# upstream recipe must be in pkgsrc/replaces.

