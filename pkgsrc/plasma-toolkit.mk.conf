# Include from a staging build's private MAKECONF. Final prefix: /usr/pkg.
# Include common-tools, common-graphics and common-media before this file.
.if defined(BSD_PKG_MK)
# Cross pkgsrc recursively builds native tools with USE_CROSS_COMPILE=no.
# Keep the target provider policy out of those host tool builds.
.if ${EMBERBSD_COMMON_GRAPHICS_CROSS:Uno:tl} != "yes" || ${USE_CROSS_COMPILE:Uno:tl} != "no"
# Old providers must be ported before they enter the current desktop closure.
.if ${PKGPATH:U} == "x11/gtk2" || ${PKGPATH:U} == "devel/SDL" || ${PKGPATH:U} == "devel/SDL2"
PKG_FAIL_REASON+= "The current Plasma toolkit rejects ${PKGPATH}; port its consumer to the supported common stack"
.endif
# Qt consumers also need the native generators when CMake finds target Qt.
# Expand late: callers may set the host path after including this profile.
.if ${USE_CROSS_COMPILE:Uno:tl} == "yes"
CMAKE_CONFIGURE_ARGS+= ${EMBERBSD_QT_HOST_PATH:D-DQT_HOST_PATH=${EMBERBSD_QT_HOST_PATH:Q}}
CMAKE_CONFIGURE_ARGS+= ${EMBERBSD_KF6_HOST_TOOLING:D-DKF6_HOST_TOOLING=${EMBERBSD_KF6_HOST_TOOLING:Q}}
CMAKE_CONFIGURE_ARGS+= ${EMBERBSD_WAYLAND_SCANNER:D-DWaylandScanner_EXECUTABLE=${EMBERBSD_WAYLAND_SCANNER:Q}}
.endif
# Match the selected host/cross compiler family. GCC remains the explicit
# platform alternative when Clang/LLVM is not selected.
.if ${EMBERBSD_CROSS_COMPILER_FAMILY:U} == "clang" ||     ${EMBERBSD_HOST_COMPILER_FAMILY:U} == "clang"
# Leave PKGSRC_COMPILER to the common cross/host Clang profile.
.else
GCC_REQD+= 16.2
PKGSRC_COMPILER= gcc
.endif
.if ${USE_CROSS_COMPILE:Uno:tl} != "yes"
MAKE_JOBS= 1
.endif
CFLAGS= -O2
CXXFLAGS= -O2
# Do not accept the base X11 OpenGL libraries or pkgsrc's amber Mesa fallback.
USE_BUILTIN.MesaLib= no
USE_BUILTIN.glu= no
USE_BUILTIN.libdrm= no
BUILDLINK_API_DEPENDS.MesaLib+= MesaLib>=26.2.4
BUILDLINK_ABI_DEPENDS.MesaLib+= MesaLib>=26.2.4
.if !defined(EMBERBSD_COMMON_TOOLS)
PKG_FAIL_REASON+= "The Plasma toolkit requires the common build-tools profile"
.endif
.if !defined(EMBERBSD_COMMON_GRAPHICS)
PKG_FAIL_REASON+= "The Plasma toolkit requires the common graphics profile"
.endif
.if ${EMBERBSD_COMMON_MEDIA:Uno} != "yes"
PKG_FAIL_REASON+= "The Plasma toolkit requires the common FFmpeg 9 media profile"
.endif
.endif
.endif
