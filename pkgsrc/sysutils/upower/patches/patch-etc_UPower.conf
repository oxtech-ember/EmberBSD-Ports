$NetBSD$

EmberBSD: shut down on critical battery. ConsoleKit on NetBSD reports
suspend support, but ACPI S3 resume is not accepted yet, so Auto could
select HybridSleep.

--- etc/UPower.conf.orig	2025-05-03 17:09:05.336647531 +0000
+++ etc/UPower.conf
@@ -111,4 +111,4 @@
 # If Suspend isn't available or AllowRiskyCriticalPowerAction=false, HybridSleep will be used
 # If HybridSleep isn't available, Hibernate will be used
 # If Hibernate isn't available, PowerOff will be used
-CriticalPowerAction=Auto
+CriticalPowerAction=PowerOff
