# Use the common UniFFI and Cargo dependency versions.
--- bindgen/cpp/Cargo.toml.orig
+++ bindgen/cpp/Cargo.toml
@@ -5,5 +5,10 @@
 resolver = "2"
 
 [workspace.dependencies]
-uniffi = "=0.32.0"
-uniffi_bindgen = { version = "=0.32.0", features = ["cargo-metadata"] }
+uniffi = "=0.32.2"
+uniffi_bindgen = { version = "=0.32.2", features = ["cargo-metadata"] }
+
+[patch.crates-io]
+uniffi_internal_macros = { path = "../../../crates/uniffi_internal_macros-0.32.2" }
+scroll_derive = { path = "../../../crates/scroll_derive-0.12.1" }
+windows-sys = { path = "../../../crates/windows-sys-0.61.2" }
