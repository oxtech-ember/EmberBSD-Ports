# SPDX-License-Identifier: BSD-2-Clause
# Origin: EmberBSD (AI-assisted). Package defaults for every EmberBSD build.
# The native and cross common tools mk.conf files and the Darwin bootstrap
# profile include this file.
.if defined(BSD_PKG_MK)
# The Ports make environment runs with LC_ALL=C, so bsdtar cannot write UTF-8
# member names. Archive extraction alone uses the UTF-8 C locale.
EXTRACT_ENV+= LC_ALL=C.UTF-8
# Identify the EmberBSD target policy for qualified base libraries.
EMBERBSD_PORTS= yes
# Record concrete native Mach-O providers from their load commands and runpaths.
# The Darwin bootstrap profile keeps this off unless a recipe turns it on.
.if ${OPSYS:U} == "Darwin" && ${USE_CROSS_COMPILE:Uno:tl} != "yes"
MACHO_USE_LOAD_COMMANDS= yes
# Native graphviz is a host tool for gi-docgen (SVG) and valadoc (PNG through
# the cairo plugin). The gd plugin is not used and pulls in its image libraries.
PKG_OPTIONS.graphviz+= -gd
.endif
# libsmi ships an Erlang/ESDL-derived data file under this permissive
# license (retain notices, no warranty, MIT-style).
ACCEPTABLE_LICENSES+= esdl-license
# Free upstream source licences used by the common U-Boot source package:
# BSD variants with explicit patent terms, Intel, LZMA SDK public-domain
# dedication, eCos GPL exception, and bzip2's BSD-style licence.
ACCEPTABLE_LICENSES+= uboot-BSD-2-Clause-Patent uboot-BSD-3-Clause-Clear
ACCEPTABLE_LICENSES+= uboot-LZMA-SDK-9.22 uboot-Intel uboot-eCos-2.0 uboot-bzip2-1.0.6
# The bulk set accepts AGPL-3 (ghostscript-agpl) and the Realtek firmware licence (rtw88-firmware).
ACCEPTABLE_LICENSES+= gnu-agpl-v3 rtlwifi-firmware-license
# Native QEMU on macOS uses codesign, which needs codesign_allocate from
# devel/cctools (APSL 2.0, OSI-approved).
ACCEPTABLE_LICENSES+= apple-public-source-license
# Native Darwin MIG (devel/mig, Apple bootstrap_cmds) generates the Kerberos
# KCM RPC stubs; its sources carry APSL 1.0 and the CMU Mach licence.
ACCEPTABLE_LICENSES+= apple-public-source-license-1.0 cmu-mig-license
# SDL3 only (pkgsrc/versions.mk): programs with an optional SDL2 backend
# use their other backends (music21 runs without pygame); FluidSynth uses
# its SDL3 driver.
PKG_OPTIONS.adplay+= -sdl2
PKG_OPTIONS.ccleste+= -sdl2 sdl
PKG_OPTIONS.fluidsynth+= -sdl2 sdl3
PKG_OPTIONS.librespot+= -sdl
PKG_OPTIONS.mpv+= -sdl2
PKG_OPTIONS.PC6001VX+= -sdl2
PKG_OPTIONS.py-music21+= -py-game
PKG_OPTIONS.spotify-player+= -sdl
PKG_OPTIONS.syncterm+= -sdl2
PKG_OPTIONS.yabause+= -sdl2
# Keep one version of each versioned family (pkgsrc/versions.mk).
.include "${.PARSEDIR}/EMBERBSD-VERSIONS.MK"
.for _ember_family in ${EMBERBSD_VERSION_FAMILIES}
.  if !empty(PKGPATH:U:M${_ember_family:C/=.*//}) && empty(PKGPATH:U:M${_ember_family:C/.*=//})
PKG_FAIL_REASON+= "EmberBSD keeps only ${_ember_family:C/.*=//} of ${_ember_family:C/=.*//}; patch the consumer onto it"
.  endif
.endfor
.endif
