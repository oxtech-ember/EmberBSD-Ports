$NetBSD$

Select the compositor and lock command of the default Wayland profile.
The X11 path uses its separate window-manager and lock-command settings.

--- config/session.conf.orig
+++ config/session.conf
@@ -1,5 +1,8 @@
 [General]
 leave_confirmation=true
+compositor=labwc
+lock_command_wayland=swaylock
+lock_command=i3lock --nofork
 
 [Environment]
 GTK_CSD=0
