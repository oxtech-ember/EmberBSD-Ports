# SPDX-License-Identifier: BSD-2-Clause
# Origin: EmberBSD (AI-assisted). Include after the host bootstrap mk.conf.
# Inputs: EMBERBSD_CROSS_TOOLS, EMBERBSD_CROSS_SYSROOT and
# EMBERBSD_CROSS_HOST_PREFIX. See README.md for the prepared tool directory.
.if defined(BSD_PKG_MK)
# This is the cross implementation of the shared tools provider. Consumers
# must not include the native-only mk.conf to identify this same provider.
EMBERBSD_COMMON_TOOLS= yes
USE_CROSS_COMPILE?=yes
TOOLDIR=${EMBERBSD_CROSS_TOOLS}
CROSS_DESTDIR=${EMBERBSD_CROSS_SYSROOT}
EMBERBSD_CROSS_TARGET?=aarch64
.if ${EMBERBSD_CROSS_TARGET} == "aarch64"
_EMBER_CROSS_MACHINE_ARCH=aarch64
_EMBER_CROSS_TRIPLET=aarch64--netbsd
.elif ${EMBERBSD_CROSS_TARGET} == "amd64"
_EMBER_CROSS_MACHINE_ARCH=x86_64
_EMBER_CROSS_TRIPLET=x86_64--netbsd
.else
PKG_FAIL_REASON+="Unsupported cross target: select aarch64 or amd64"
_EMBER_CROSS_MACHINE_ARCH=aarch64
_EMBER_CROSS_TRIPLET=aarch64--netbsd
.endif
CROSS_MACHINE_ARCH=${_EMBER_CROSS_MACHINE_ARCH}
.if ${CROSS_MACHINE_ARCH} != ${_EMBER_CROSS_MACHINE_ARCH}
PKG_FAIL_REASON+="CROSS_MACHINE_ARCH must match the selected cross target"
.endif
CROSS_OPSYS=NetBSD
CROSS_OS_VERSION=11.0
CROSS_OPSYS_VERSION=110000
CROSS_LOWER_OPSYS=netbsd
CROSS_LOWER_OPSYS_VERSUFFIX=
CROSS_LOWER_OS_VARIANT=
CROSS_OS_VARIANT=
CROSS_LOWER_VARIANT_VERSION=
CROSS_LOWER_VENDOR=
CROSS_OBJECT_FMT=ELF
CROSS_LOCALBASE=/usr/pkg
CROSS_SYSCONFBASE=/usr/pkg/etc
CROSS_PKG_TOOLS_BIN=${EMBERBSD_CROSS_HOST_PREFIX}/sbin
PKG_DEVELOPER=yes
.for _ember_input in EMBERBSD_CROSS_TOOLS EMBERBSD_CROSS_SYSROOT EMBERBSD_CROSS_HOST_PREFIX
.if empty(${_ember_input}:M/*) || !exists(${${_ember_input}})
PKG_FAIL_REASON+="${_ember_input} must name an existing absolute directory"
.endif
.endfor

.if ${USE_CROSS_COMPILE:tl} == "yes" || ${LIBTOOL_CROSS_COMPILE:Uno:tl} == "yes"
PKGSRC_COMPILER=gcc
GCCBASE=${TOOLDIR}
# Here "native" means an existing host executable, the GCC16 cross driver.
USE_NATIVE_GCC=yes
USE_PKGSRC_GCC=no
.MAKEFLAGS: USE_PKGSRC_GCC_RUNTIME=no
CC=${TOOLDIR}/bin/${_EMBER_CROSS_TRIPLET}-gcc
CXX=${TOOLDIR}/bin/${_EMBER_CROSS_TRIPLET}-g++
.if ${CC} != "${TOOLDIR}/bin/${_EMBER_CROSS_TRIPLET}-gcc" || \
    ${CXX} != "${TOOLDIR}/bin/${_EMBER_CROSS_TRIPLET}-g++"
PKG_FAIL_REASON+="Compilers must match the selected cross target"
.endif
CPP=${CC} -E
GCC_REQD+=16.2
.if ${PKGSRC_COMPILER} != "gcc" || ${USE_NATIVE_GCC:tl} != "yes" || ${USE_PKGSRC_GCC:tl} != "no"
PKG_FAIL_REASON+="The cross profile requires the existing GCC16 cross driver"
.endif
.if ${USE_PKGSRC_GCC_RUNTIME:Uno:tl} != "no"
PKG_FAIL_REASON+="The cross profile uses the complete gcc16 package, not gcc16-libs"
.endif
.if !exists(${CROSS_DESTDIR}/usr/pkg/gcc16/lib/gcc/${_EMBER_CROSS_TRIPLET}/16.2.0/crtbeginS.o) || \
    !exists(${CROSS_DESTDIR}/usr/pkg/gcc16/lib/libstdc++.so.7)
PKG_FAIL_REASON+="The sysroot must contain the selected target GCC16 CRT and runtime"
.endif
# Libtool drops a bare -B from its shared-library command. The compiler
# wrappers must apply the selected target CRT path after libtool dispatch.
CWRAPPERS_APPEND.cc+=-B${CROSS_DESTDIR}/usr/pkg/gcc16/lib/gcc/${_EMBER_CROSS_TRIPLET}/16.2.0/
CWRAPPERS_APPEND.cxx+=-B${CROSS_DESTDIR}/usr/pkg/gcc16/lib/gcc/${_EMBER_CROSS_TRIPLET}/16.2.0/
LDFLAGS+=-L${CROSS_DESTDIR}/usr/pkg/gcc16/lib -Wl,-rpath,/usr/pkg/gcc16/lib
BUILDLINK_PASSTHRU_DIRS+=${CROSS_DESTDIR}/usr/pkg/gcc16
BUILDLINK_PASSTHRU_RPATHDIRS+=/usr/pkg/gcc16/lib
.endif
.if ${USE_CROSS_COMPILE:tl} == "yes"
# Generators such as BFD's chew must execute on the build host. Bare gcc
# resolves to the target compiler inside pkgsrc's wrapper PATH.
EMBERBSD_CROSS_BUILD_CC?=/usr/bin/cc
EMBERBSD_CROSS_BUILD_CXX?=/usr/bin/c++
.for _ember_build_cc in EMBERBSD_CROSS_BUILD_CC EMBERBSD_CROSS_BUILD_CXX
.if empty(${_ember_build_cc}:M/*) || !exists(${${_ember_build_cc}})
PKG_FAIL_REASON+="${_ember_build_cc} must name an existing absolute host compiler"
.endif
.endfor
# Some recipes (including Bash) append CC_FOR_BUILD=${NATIVE_CC} later.
# Keep that standard pkgsrc variable consistent with the selected host compiler.
NATIVE_CC=${EMBERBSD_CROSS_BUILD_CC}
NATIVE_CXX=${EMBERBSD_CROSS_BUILD_CXX}
.if ${NATIVE_CC} != ${EMBERBSD_CROSS_BUILD_CC} || ${NATIVE_CXX} != ${EMBERBSD_CROSS_BUILD_CXX}
PKG_FAIL_REASON+="Cross generators require the selected native build compilers"
.endif
CONFIGURE_ENV+=CC_FOR_BUILD=${EMBERBSD_CROSS_BUILD_CC:Q}
CONFIGURE_ENV+=CXX_FOR_BUILD=${EMBERBSD_CROSS_BUILD_CXX:Q}
# Package scripts use this target utility; the build wrapper is a no-op.
.if exists(${CROSS_DESTDIR}/usr/bin/install-info)
TOOLS_PLATFORM.install-info=/usr/bin/install-info
.endif
# check-files compares two file lists that different helpers sort: the
# expected list comes from ${SORT} while the cross case-check sorts with
# LC_ALL=C. Pin one collation or large packages report phantom extras.
# TOOLS_SORT is a single executable in pkgsrc's libtool PLIST expansion.
TOOLS_PLATFORM.sort=/usr/bin/sort
LC_ALL=C
.export LC_ALL
.if ${PKGPATH} == "lang/gcc16"
PKG_FAIL_REASON+="Import the repaired target GCC16 package and metadata before building consumers"
.endif
# Runtime-only images must not install a compiler to execute applications.
# Both mutually exclusive packages retain the same GCC16 prefix and ABI.
EMBERBSD_GCC16_RUNTIME_PROVIDER?=compiler
.if ${EMBERBSD_GCC16_RUNTIME_PROVIDER} != "compiler" && ${EMBERBSD_GCC16_RUNTIME_PROVIDER} != "runtime"
PKG_FAIL_REASON+="Select compiler or runtime as the single GCC16 runtime provider"
.elif ${PKGPATH} == "lang/gcc16-runtime"
.if ${EMBERBSD_GCC16_RUNTIME_PROVIDER} != "runtime"
PKG_FAIL_REASON+="The runtime package requires the runtime provider"
.endif
.elif ${PKGPATH} == "lang/gcc16-libs"
PKG_FAIL_REASON+="gcc16-libs is not a provider in this cross profile"
.elif ${EMBERBSD_GCC16_RUNTIME_PROVIDER} == "compiler"
DEPENDS+=gcc16>=16.2.0nb1:../../lang/gcc16
.else
DEPENDS+=gcc16-runtime>=16.2.0nb1:../../lang/gcc16-runtime
.endif
# A stale /lib copy must not bypass the fork's libc through another RPATH.
# This is an alias consistency check, not proof of complete base provenance.
pre-extract: emberbsd-cross-libc-check
.PHONY: emberbsd-cross-libc-check
emberbsd-cross-libc-check:
	${RUN}for libc in /lib/libc.so /lib/libc.so.12 /usr/lib/libc.so /usr/lib/libc.so.12; do \
		cmp -s ${CROSS_DESTDIR:Q}/usr/lib/libc.so.12 ${CROSS_DESTDIR:Q}$$libc || { \
			echo "Missing or divergent EmberBSD libc alias: $$libc" >&2; exit 1; \
		}; \
	done
# Stage without privilege, but ship target ownership, never the Mac user's UID.
PKG_CREATE=${NATIVE_PKG_CREATE_CMD} ${PKGTOOLS_ARGS} -u root -g wheel
REAL_ROOT_USER=root
REAL_ROOT_GROUP=wheel
.endif
.endif
