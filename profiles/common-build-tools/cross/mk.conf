# SPDX-License-Identifier: BSD-2-Clause
# Origin: EmberBSD (AI-assisted). Include after the host bootstrap mk.conf.
# Inputs: EMBERBSD_CROSS_TOOLS, EMBERBSD_CROSS_SYSROOT and
# EMBERBSD_CROSS_HOST_PREFIX. See README.md for the prepared tool directory.
.if defined(BSD_PKG_MK)
.if exists(${.PARSEDIR}/native-tools.mk)
.include "${.PARSEDIR}/native-tools.mk"
.else
.include "${.PARSEDIR}/EMBERBSD-NATIVE-TOOLS.MK"
.endif
# This is the cross implementation of the shared tools provider. Consumers
# must not include the native-only mk.conf to identify this same provider.
EMBERBSD_COMMON_TOOLS= yes
.include "${.PARSEDIR}/EMBERBSD-DEFAULTS-MK.CONF"
USE_CROSS_COMPILE?=yes
# Cargo tools run on the build host. Select the maintained shared binary
# provider instead of pkgsrc's source-built target Rust/LLVM toolchain.
RUST_TYPE?=bin
# Generators in cross recipes run under the host prefix Perl.
EMBERBSD_CROSS_BUILD_PERL?=${TOOLBASE}/bin/perl
TOOLDIR=${EMBERBSD_CROSS_TOOLS}
CROSS_DESTDIR=${EMBERBSD_CROSS_SYSROOT}
EMBERBSD_CROSS_TARGET?=aarch64
EMBERBSD_CROSS_COMPILER_FAMILY?=clang
.if ${EMBERBSD_CROSS_COMPILER_FAMILY} != "clang" && ${EMBERBSD_CROSS_COMPILER_FAMILY} != "gcc"
.error Select clang or gcc as the cross compiler family
.endif
.if ${EMBERBSD_CROSS_TARGET} == "aarch64"
_EMBER_CROSS_MACHINE_ARCH=aarch64
_EMBER_CROSS_TRIPLET=aarch64--netbsd
.elif ${EMBERBSD_CROSS_TARGET} == "amd64"
_EMBER_CROSS_MACHINE_ARCH=x86_64
_EMBER_CROSS_TRIPLET=x86_64--netbsd
.else
PKG_FAIL_REASON+="Unsupported cross target: select aarch64 or amd64"
_EMBER_CROSS_MACHINE_ARCH=aarch64
_EMBER_CROSS_TRIPLET=aarch64--netbsd
.endif
CROSS_MACHINE_ARCH=${_EMBER_CROSS_MACHINE_ARCH}
.if ${CROSS_MACHINE_ARCH} != ${_EMBER_CROSS_MACHINE_ARCH}
PKG_FAIL_REASON+="CROSS_MACHINE_ARCH must match the selected cross target"
.endif
CROSS_OPSYS=NetBSD
CROSS_OS_VERSION=11.0
CROSS_OPSYS_VERSION=110000
CROSS_LOWER_OPSYS=netbsd
CROSS_LOWER_OPSYS_VERSUFFIX=
CROSS_LOWER_OS_VARIANT=
CROSS_OS_VARIANT=
CROSS_LOWER_VARIANT_VERSION=
CROSS_LOWER_VENDOR=
CROSS_OBJECT_FMT=ELF
CROSS_LOCALBASE=/usr/pkg
# Base rc.subr and rc.conf belong to the target /etc. Package config keeps
# pkgsrc's separate PKG_SYSCONFBASE default, ${PREFIX}/etc.
CROSS_SYSCONFBASE?=/etc
# The target rc framework scans /etc/rc.d, independent of package config.
RCD_SCRIPTS_DIR?=/etc/rc.d
CROSS_PKG_TOOLS_BIN=${EMBERBSD_CROSS_HOST_PREFIX}/sbin
PKG_DEVELOPER=yes
.for _ember_input in EMBERBSD_CROSS_TOOLS EMBERBSD_CROSS_SYSROOT EMBERBSD_CROSS_HOST_PREFIX
.if empty(${_ember_input}:M/*) || !exists(${${_ember_input}})
PKG_FAIL_REASON+="${_ember_input} must name an existing absolute directory"
.endif
.endfor

.if ${USE_CROSS_COMPILE:tl} == "yes" || ${LIBTOOL_CROSS_COMPILE:Uno:tl} == "yes"
.if ${EMBERBSD_CROSS_COMPILER_FAMILY} == "clang"
.if !empty(.MAKEOVERRIDES:M_EMBER_TARGET_*)
.error Do not override prepared cross tool variables
.endif
.if !exists(${TOOLDIR}/target.mk)
.error Prepare the selected Clang tools and application sysroot first
.endif
.include "${TOOLDIR}/target.mk"
.if ${_EMBER_TARGET_FAMILY:U} != "clang" || \
    ${_EMBER_TARGET_TARGET:U} != ${EMBERBSD_CROSS_TARGET} || \
    ${_EMBER_TARGET_TRIPLET:U} != ${_EMBER_CROSS_TRIPLET} || \
    "${_EMBER_TARGET_SYSROOT:U}" != "${CROSS_DESTDIR}" || \
    "${_EMBER_TARGET_TOOLS:U}" != "${TOOLDIR}"
.error Prepared Clang tools do not match the selected target and sysroot
.endif
.if ${_EMBER_TARGET_RUNTIME_KIND:U} == "stage"
EMBER_LLVM_CXX_STAGE=${_EMBER_TARGET_RUNTIME_ROOT}
EMBER_LLVM_CXX_BASE=${_EMBER_TARGET_RUNTIME_BASE}
.elif ${_EMBER_TARGET_RUNTIME_KIND:U} == "sysroot"
EMBER_LLVM_CXX_SYSROOT=${_EMBER_TARGET_RUNTIME_ROOT}
.endif
.if !empty(_EMBER_TARGET_NATIVE_PYTHON:U)
EMBER_LLVM_CXX_PYTHON=${_EMBER_TARGET_NATIVE_PYTHON}
.endif
PKGSRC_COMPILER=clang
CLANGBASE=${TOOLDIR}
CC=${TOOLDIR}/bin/${_EMBER_CROSS_TRIPLET}-clang
CXX=${TOOLDIR}/bin/${_EMBER_CROSS_TRIPLET}-clang++
CPP=${TOOLDIR}/bin/${_EMBER_CROSS_TRIPLET}-clang-cpp
.if ${PKGSRC_COMPILER} != "clang" || "${CLANGBASE}" != "${TOOLDIR}" || \
    "${CC}" != "${TOOLDIR}/bin/${_EMBER_CROSS_TRIPLET}-clang" || \
    "${CXX}" != "${TOOLDIR}/bin/${_EMBER_CROSS_TRIPLET}-clang++" || \
    "${CPP}" != "${TOOLDIR}/bin/${_EMBER_CROSS_TRIPLET}-clang-cpp"
.error Compilers must match the selected Clang cross tools
.endif
.for _ember_role in as ld ar ranlib nm strip objcopy objdump readelf
${_ember_role:tu}=${TOOLDIR}/bin/${_EMBER_CROSS_TRIPLET}-${_ember_role}
.if "${${_ember_role:tu}}" != "${TOOLDIR}/bin/${_EMBER_CROSS_TRIPLET}-${_ember_role}"
.error ${_ember_role} differs from the selected cross tool
.endif
.endfor
# Compiler bindings add the measured runtime only to link operations.
# Buildlink must retain their selected headers and runtime search paths.
BUILDLINK_PASSTHRU_DIRS+=${CROSS_DESTDIR}/${_EMBER_TARGET_RUNTIME_PREFIX}
.if defined(_EMBER_TARGET_RUNTIME_ROOT)
BUILDLINK_PASSTHRU_DIRS+=${_EMBER_TARGET_RUNTIME_ROOT}/${_EMBER_TARGET_RUNTIME_PREFIX}
# The physical stage is a compile/link input, never a target loader path.
_BLNK_TRANSFORM+=rpath:${_EMBER_TARGET_RUNTIME_ROOT}/${_EMBER_TARGET_RUNTIME_PREFIX}:/${_EMBER_TARGET_RUNTIME_PREFIX}
_CWRAPPERS_TRANSFORM+=R:${_EMBER_TARGET_RUNTIME_ROOT}/${_EMBER_TARGET_RUNTIME_PREFIX}:/${_EMBER_TARGET_RUNTIME_PREFIX}
.endif
.for _ember_runtime_dir in ${_EMBER_TARGET_RUNTIME_LIBRARY_PATHS:S/;/ /g}
.if defined(_EMBER_TARGET_RUNTIME_ROOT)
BUILDLINK_PASSTHRU_RPATHDIRS+=${_ember_runtime_dir:S,^${_EMBER_TARGET_RUNTIME_ROOT},,}
.else
BUILDLINK_PASSTHRU_RPATHDIRS+=${_ember_runtime_dir:S,^${CROSS_DESTDIR},,}
.endif
.endfor
.else
PKGSRC_COMPILER=gcc
GCCBASE=${TOOLDIR}
# Here "native" means an existing host executable, the GCC16 cross driver.
USE_NATIVE_GCC=yes
USE_PKGSRC_GCC=no
.MAKEFLAGS: USE_PKGSRC_GCC_RUNTIME=no
CC=${TOOLDIR}/bin/${_EMBER_CROSS_TRIPLET}-gcc
CXX=${TOOLDIR}/bin/${_EMBER_CROSS_TRIPLET}-g++
.if ${CC} != "${TOOLDIR}/bin/${_EMBER_CROSS_TRIPLET}-gcc" || \
    ${CXX} != "${TOOLDIR}/bin/${_EMBER_CROSS_TRIPLET}-g++"
PKG_FAIL_REASON+="Compilers must match the selected cross target"
.endif
CPP=${CC} -E
GCC_REQD+=16.2
.if ${PKGSRC_COMPILER} != "gcc" || ${USE_NATIVE_GCC:tl} != "yes" || ${USE_PKGSRC_GCC:tl} != "no"
PKG_FAIL_REASON+="The cross profile requires the existing GCC16 cross driver"
.endif
.if ${USE_PKGSRC_GCC_RUNTIME:Uno:tl} != "no"
PKG_FAIL_REASON+="The cross profile uses the complete gcc16 package, not gcc16-libs"
.endif
.if !exists(${CROSS_DESTDIR}/usr/pkg/gcc16/lib/gcc/${_EMBER_CROSS_TRIPLET}/16.2.0/crtbeginS.o) || \
    !exists(${CROSS_DESTDIR}/usr/pkg/gcc16/lib/libstdc++.so.7)
PKG_FAIL_REASON+="The sysroot must contain the selected target GCC16 CRT and runtime"
.endif
# Consumers inline std::call_once from these headers. Stale non-TLS headers
# produce binaries that the TLS runtime cannot load (cross-tls.md in
# profiles/development-toolchain).
_EMBER_CXX_CONFIG=${CROSS_DESTDIR}/usr/pkg/gcc16/include/c++/${_EMBER_CROSS_TRIPLET}/bits/c++config.h
.if exists(${_EMBER_CXX_CONFIG})
_EMBER_CXX_TLS!=grep -c '^\#define _GLIBCXX_HAVE_TLS 1$$' ${_EMBER_CXX_CONFIG:Q} || true
.if ${_EMBER_CXX_TLS} != "1"
PKG_FAIL_REASON+="The sysroot GCC16 C++ headers must come from a TLS runtime stage"
.endif
.endif
# Libtool drops a bare -B from its shared-library command. The compiler
# wrappers must apply the selected target CRT path after libtool dispatch.
CWRAPPERS_APPEND.cc+=-B${CROSS_DESTDIR}/usr/pkg/gcc16/lib/gcc/${_EMBER_CROSS_TRIPLET}/16.2.0/
CWRAPPERS_APPEND.cxx+=-B${CROSS_DESTDIR}/usr/pkg/gcc16/lib/gcc/${_EMBER_CROSS_TRIPLET}/16.2.0/
# GCC also locates libgomp.spec through its prefix search. Select the staged
# GCC16 development metadata before the base compiler's /usr/lib copy.
CWRAPPERS_APPEND.cc+=-B${CROSS_DESTDIR}/usr/pkg/gcc16/lib/
CWRAPPERS_APPEND.cxx+=-B${CROSS_DESTDIR}/usr/pkg/gcc16/lib/
LDFLAGS+=-L${CROSS_DESTDIR}/usr/pkg/gcc16/lib -Wl,-rpath,/usr/pkg/gcc16/lib
# The target linker resolves transitive DT_NEEDED entries (freetype→png,
# glib→pcre2/ffi) only through rpath-link, not through -rpath or -L. The
# g-ir-scanner dumper builds its own link command without buildlink flags,
# so every cross link carries the sysroot library dirs explicitly.
LDFLAGS+=-Wl,-rpath-link,${CROSS_DESTDIR}/usr/pkg/lib -Wl,-rpath-link,${CROSS_DESTDIR}/usr/pkg/gcc16/lib
# The cross GNU ld has no configured sysroot. It finds base libraries that
# package libraries need (sqlite3→libm, libpthread) only through rpath-link.
# The wrappers add this link search, so package metadata does not record it.
# Direct linker calls do not use these wrapper arguments.
CWRAPPERS_APPEND.cc+=-Wl,-rpath-link,${CROSS_DESTDIR}/usr/lib
CWRAPPERS_APPEND.cxx+=-Wl,-rpath-link,${CROSS_DESTDIR}/usr/lib
BUILDLINK_PASSTHRU_DIRS+=${CROSS_DESTDIR}/usr/pkg/gcc16
BUILDLINK_PASSTHRU_RPATHDIRS+=/usr/pkg/gcc16/lib
.endif
.else
# Native dependency recursion installs into the host prefix. Select its tools
# with the same native profile that built the prefix, never pkgsrc GCC or cc.
# pkgsrc assigns PREFIX from LOCALBASE only after MAKECONF; the profile checks it.
PREFIX?= ${LOCALBASE}
.if exists(${.PARSEDIR}/native-tools.mk)
.include "${.PARSEDIR}/../mk.conf"
.else
.include "${.PARSEDIR}/EMBERBSD-COMMON-TOOLS-MK.CONF"
.endif
.endif
# The late language hook selects host Flang with the target Flang-RT, or in
# native recursion with the native prefix Flang-RT. No pkgsrc Fortran
# compiler module may add GCC to a Clang build, cross or native.
.if ${USE_CROSS_COMPILE:tl} == "yes" || ${LIBTOOL_CROSS_COMPILE:Uno:tl} == "yes"
_EMBER_FORTRAN_FAMILY=${EMBERBSD_CROSS_COMPILER_FAMILY}
.else
_EMBER_FORTRAN_FAMILY=${EMBERBSD_HOST_COMPILER_FAMILY:U}
.endif
.if "${_EMBER_FORTRAN_FAMILY}" == "clang"
PKGSRC_FORTRAN=
.if !empty(PKGSRC_FORTRAN)
.error The Clang profile uses only its own Flang for Fortran
.endif
.endif
# Defer language policy until options.mk has finished USE_LANGUAGES.
# FFTW selects its default Fortran language after the first bsd.prefs include.
.if exists(${.PARSEDIR}/compiler-policy.mk)
PKGSRC_COMPILER_PRE_CONFIG_MK:=${.PARSEDIR}/compiler-policy.mk
.else
PKGSRC_COMPILER_PRE_CONFIG_MK:=${.PARSEDIR}/EMBERBSD-CROSS-COMPILER-POLICY.MK
.endif
.if ${USE_CROSS_COMPILE:tl} == "yes"
# Keep the native build shell out of installed target script headers.
REPLACE.sys-sh.new?= /bin/sh
# The NetBSD base shell is outside the packages-only application sysroot.
CHECK_INTERPRETER_BASE_PATHS+= /bin/sh
# pkg-config returns build-time include/library paths from target .pc files.
# Root these paths for configure and build; runtime paths remain target paths.
CONFIGURE_ENV+= PKG_CONFIG_SYSROOT_DIR=${CROSS_DESTDIR:Q}
MAKE_ENV+= PKG_CONFIG_SYSROOT_DIR=${CROSS_DESTDIR:Q}
# CMake must identify the target before checking its platform and ABI.
# The CMake configure framework appends these after the package Makefile,
# so a recipe that assigns CMAKE_CONFIGURE_ARGS= cannot drop them.
# Programs execute on the build host; target headers and libraries stay rooted.
EMBERBSD_CROSS_CMAKE_ARGS+= -DCMAKE_SYSTEM_NAME:STRING=${CROSS_OPSYS:Q}
EMBERBSD_CROSS_CMAKE_ARGS+= -DCMAKE_SYSTEM_PROCESSOR:STRING=${CROSS_MACHINE_ARCH:Q}
EMBERBSD_CROSS_CMAKE_ARGS+= -DCMAKE_SYSROOT:PATH=${CROSS_DESTDIR:Q}
# Prevent discovery of target-only archivers in the buildlink directory.
EMBERBSD_CROSS_CMAKE_ARGS+= -DCMAKE_AR:FILEPATH=${AR:Q}
EMBERBSD_CROSS_CMAKE_ARGS+= -DCMAKE_RANLIB:FILEPATH=${RANLIB:Q}
.if ${EMBERBSD_CROSS_COMPILER_FAMILY} == "clang"
EMBERBSD_CROSS_CMAKE_ARGS+= -DCMAKE_LIBRARY_PATH:STRING=${_EMBER_TARGET_RUNTIME_LIBRARY_PATHS:Q}
.else
# FindPkgConfig resolves explicit -lstdc++ before the compiler's -B search.
EMBERBSD_CROSS_CMAKE_ARGS+= -DCMAKE_LIBRARY_PATH:PATH=${CROSS_DESTDIR:Q}/usr/pkg/gcc16/lib
.endif
# Prefer the dependency selected by pkgsrc before a same-named base library.
# CMake searches all candidates in each root before it tries the next root.
EMBERBSD_CROSS_CMAKE_ARGS+= -DCMAKE_FIND_ROOT_PATH:STRING=${BUILDLINK_DIR:Q}\;${CROSS_DESTDIR:Q}
EMBERBSD_CROSS_CMAKE_ARGS+= -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM:STRING=NEVER
EMBERBSD_CROSS_CMAKE_ARGS+= -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY:STRING=ONLY
EMBERBSD_CROSS_CMAKE_ARGS+= -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE:STRING=ONLY
EMBERBSD_CROSS_CMAKE_ARGS+= -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE:STRING=ONLY
# Native generators use the selected host-prefix compiler and ABI inputs.
# Recipes such as Bash and libX11 append these commands to CONFIGURE_ENV later.
NATIVE_CC=${_EMBER_NATIVE_CC_COMMAND}
NATIVE_CXX=${_EMBER_NATIVE_CXX_COMMAND}
NATIVE_CPP=${_EMBER_NATIVE_CPP_COMMAND}
NATIVE_AS=${EMBERBSD_CROSS_BUILD_AS}
NATIVE_LD=${EMBERBSD_CROSS_BUILD_LD}
NATIVE_AR=${EMBERBSD_CROSS_BUILD_AR}
NATIVE_RANLIB=${EMBERBSD_CROSS_BUILD_RANLIB}
NATIVE_NM=${EMBERBSD_CROSS_BUILD_NM}
NATIVE_STRIP=${EMBERBSD_CROSS_BUILD_STRIP}
.if "${NATIVE_CC}" != "${_EMBER_NATIVE_CC_COMMAND}" || "${NATIVE_CXX}" != "${_EMBER_NATIVE_CXX_COMMAND}" || \
    "${NATIVE_CPP}" != "${_EMBER_NATIVE_CPP_COMMAND}"
PKG_FAIL_REASON+="Cross generators require the selected native build compilers"
.endif
.for _ember_native_role in AS LD AR RANLIB NM STRIP
.if "${NATIVE_${_ember_native_role}}" != "${EMBERBSD_CROSS_BUILD_${_ember_native_role}}"
PKG_FAIL_REASON+="NATIVE_${_ember_native_role} differs from the selected Ports tool"
.endif
.endfor
CONFIGURE_ENV+=CC_FOR_BUILD=${NATIVE_CC:Q}
CONFIGURE_ENV+=CXX_FOR_BUILD=${NATIVE_CXX:Q}
CONFIGURE_ENV+=CPP_FOR_BUILD=${NATIVE_CPP:Q}
CONFIGURE_ENV+=AS_FOR_BUILD=${NATIVE_AS:Q}
CONFIGURE_ENV+=LD_FOR_BUILD=${NATIVE_LD:Q}
CONFIGURE_ENV+=AR_FOR_BUILD=${NATIVE_AR:Q}
CONFIGURE_ENV+=RANLIB_FOR_BUILD=${NATIVE_RANLIB:Q}
CONFIGURE_ENV+=NM_FOR_BUILD=${NATIVE_NM:Q}
CONFIGURE_ENV+=STRIP_FOR_BUILD=${NATIVE_STRIP:Q}
CONFIGURE_ENV+=CPPFLAGS_FOR_BUILD=${NATIVE_CPPFLAGS:Q}
CONFIGURE_ENV+=CFLAGS_FOR_BUILD=${NATIVE_CFLAGS:Q}
CONFIGURE_ENV+=CXXFLAGS_FOR_BUILD=${NATIVE_CXXFLAGS:Q}
CONFIGURE_ENV+=LDFLAGS_FOR_BUILD=${NATIVE_LDFLAGS:Q}
# Package scripts use a target utility; the build wrapper is a no-op.
.if exists(${CROSS_DESTDIR}/usr/bin/install-info)
TOOLS_PLATFORM.install-info=/usr/bin/install-info
_TOOLS_USE_PKGSRC.install-info=no
.else
# Use pkgsrc's target run dependency when the base sysroot omits the tool.
# The pkgsrc patch routes its path from TOOLBASE to CROSS_LOCALBASE.
TOOLS_PLATFORM.install-info=
_TOOLS_USE_PKGSRC.install-info=yes
.endif
# check-files compares two file lists that different helpers sort: the
# expected list comes from ${SORT} while the cross case-check sorts with
# LC_ALL=C. Pin one collation or large packages report phantom extras.
# pkgsrc's TOOLS_SORT keeps only the executable word. The selected native
# tool is already a single path; export the same collation to every child.
LC_ALL:=	C
.export LC_ALL
# Runtime-only images must not install a compiler to execute applications.
# Both mutually exclusive packages retain the same GCC16 prefix and ABI.
.if ${EMBERBSD_CROSS_COMPILER_FAMILY} == "gcc"
EMBERBSD_GCC16_RUNTIME_PROVIDER?=compiler
.if ${EMBERBSD_GCC16_RUNTIME_PROVIDER} != "compiler" && ${EMBERBSD_GCC16_RUNTIME_PROVIDER} != "runtime"
PKG_FAIL_REASON+="Select compiler or runtime as the single GCC16 runtime provider"
.elif ${PKGPATH} == "lang/gcc16-runtime"
.if ${EMBERBSD_GCC16_RUNTIME_PROVIDER} != "runtime"
PKG_FAIL_REASON+="The runtime package requires the runtime provider"
.endif
.elif ${PKGPATH} == "lang/gcc16-libs"
PKG_FAIL_REASON+="gcc16-libs is not a provider in this cross profile"
.elif ${EMBERBSD_GCC16_RUNTIME_PROVIDER} == "compiler"
DEPENDS+=gcc16>=16.2.0nb1:../../lang/gcc16
.else
# Cross consumers inline TLS std::call_once from the nb5 runtime-stage headers.
# See profiles/development-toolchain/cross-tls.md.
DEPENDS+=gcc16-runtime>=16.2.0nb5:../../lang/gcc16-runtime
.endif
.if ${PKGPATH} == "lang/gcc16"
.if ${EMBERBSD_GCC16_RUNTIME_PROVIDER} == "compiler"
PKG_FAIL_REASON+="Import the repaired target GCC16 package and metadata before building consumers"
.else
# The target compiler is a native GCC16 built on this host. It layers over
# the runtime provider and leaves that package's shared libraries to it.
# Its language and option selection matches the development profile.
PKG_OPTIONS.gcc16=gcc-c++ always-libgcc -nls -gcc-inplace-math \
    -gcc-fortran -gcc-objc -gcc-objc++ -gcc-cobol -gcc-go -gcc-graphite
GCC16_CROSS_TARGET_FLAGS=-B${CROSS_DESTDIR}/usr/pkg/gcc16/lib/gcc/${_EMBER_CROSS_TRIPLET}/16.2.0/
# nb6 is the first runtime revision that permits this layered compiler.
DEPENDS+=gcc16-runtime>=16.2.0nb6:../../lang/gcc16-runtime
# The PLIST lists the staged files. Libtool archive expansion would add the
# runtime libraries again, which the layer has removed from the stage.
LIBTOOLIZE_PLIST=no
_EMBER_GCC16_LAYER:=${.PARSEDIR}/gcc16-external-runtime.sh
post-install: emberbsd-gcc16-external-runtime
.PHONY: emberbsd-gcc16-external-runtime
emberbsd-gcc16-external-runtime:
	${RUN}${SH} ${_EMBER_GCC16_LAYER:Q} ${DESTDIR:Q} ${LOCALBASE:Q} \
	    ${CROSS_DESTDIR:Q} ${PKG_DBDIR:Q} ${CROSS_PKG_TOOLS_BIN:Q}/pkg_info \
	    ${TOOLDIR:Q}/bin/${_EMBER_CROSS_TRIPLET}-readelf ${_EMBER_CROSS_TRIPLET}
.endif
.endif
.elif !empty(PKGPATH:U:Mlang/gcc16*)
# The Clang cross profile uses LLVM runtimes. GCC16 compilers and runtimes
# belong to the GCC family; scripts/cross-bulk.sh refuses a graph reaching one.
PKG_SKIP_REASON+="GCC16 packages belong to the GCC cross compiler family"
.endif
# A stale /lib copy must not bypass the fork's libc through another RPATH.
# This is an alias consistency check, not proof of complete base provenance.
pre-extract: emberbsd-cross-libc-check
.PHONY: emberbsd-cross-libc-check
emberbsd-cross-libc-check:
	${RUN}for libc in /lib/libc.so /lib/libc.so.12 /usr/lib/libc.so /usr/lib/libc.so.12; do \
		cmp -s ${CROSS_DESTDIR:Q}/usr/lib/libc.so.12 ${CROSS_DESTDIR:Q}$$libc || { \
			echo "Missing or divergent EmberBSD libc alias: $$libc" >&2; exit 1; \
		}; \
	done
# Numeric archive identities keep target root ownership independent of host NSS.
TOOL_DEPENDS+=pkg_install>=20260227nb8:../../pkgtools/pkg_install
PKG_CREATE=${NATIVE_PKG_CREATE_CMD} ${PKGTOOLS_ARGS} -u '\#0' -g '\#0'
PKG_CREATE_OWNER=\#0
PKG_CREATE_GROUP=\#0
REAL_ROOT_USER=root
REAL_ROOT_GROUP=wheel
.endif
.endif
