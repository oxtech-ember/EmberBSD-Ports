# SPDX-License-Identifier: BSD-2-Clause
# Origin: EmberBSD contributors (AI-assisted). Installed native Ports tools.
# Include after PREFIX/LOCALBASE and the native-prefix inputs. Initial compiler
# acquisition uses the existing bootstrap interfaces, not this profile.
.if defined(BSD_PKG_MK)
EMBERBSD_COMMON_TOOLS= yes
# Native prefix libraries must use the termcap provider linked by its tools.
PREFER_PKGSRC+= termcap curses
# Native package state and service scripts remain inside the selected prefix.
VARBASE?= ${PREFIX}/var
RCD_SCRIPTS_DIR?= ${PREFIX}/etc/rc.d
# The normal native fetcher uses the selected Ports OpenSSL for HTTPS.
PKG_OPTIONS.libfetch+= openssl
# Native Qt needs proxy functionality, not generated API documentation.
PKG_OPTIONS.libproxy+= -doc
# Keep the Vala compiler and bindings without native documentation tooling.
PKG_OPTIONS.vala+= -valadoc
.if exists(${.PARSEDIR}/cross/native-tools.mk)
.include "${.PARSEDIR}/cross/native-tools.mk"
.else
.include "${.PARSEDIR}/EMBERBSD-NATIVE-TOOLS.MK"
.endif
PKGSRC_COMPILER?= ${EMBERBSD_HOST_COMPILER_FAMILY}
.if ${PKGSRC_COMPILER:[-1]} != ${EMBERBSD_HOST_COMPILER_FAMILY} || \
    !empty(PKGSRC_COMPILER:N${EMBERBSD_HOST_COMPILER_FAMILY}:Nccache:Ndistcc)
.error PKGSRC_COMPILER differs from the selected native prefix family
.endif
# Keep pkgsrc language selection from silently replacing the chosen family.
.MAKEFLAGS: PKGSRC_COMPILER=${PKGSRC_COMPILER:Q}
.if ${PREFIX} != ${EMBERBSD_HOST_PREFIX} || ${LOCALBASE} != ${EMBERBSD_HOST_PREFIX}
.error PREFIX and LOCALBASE must equal the selected native Ports prefix
.endif
.if ${USE_CROSS_COMPILE:Uno:tl} == "yes"
.error The common tools profile requires native package builds
.endif
# Choose exact executables before pkgsrc supplies its compiler wrappers.
.for _ember_role in CC CXX CPP AS LD AR RANLIB NM STRIP
.if !empty(.MAKEOVERRIDES:MPKG_${_ember_role}) && "${PKG_${_ember_role}}" != "${_EMBER_SDK_${_ember_role}}"
.error PKG_${_ember_role} differs from the selected native Ports tool
.endif
.if !empty(.MAKEOVERRIDES:M${_ember_role}) && "${${_ember_role}}" != "${_EMBER_SDK_${_ember_role}}"
.error ${_ember_role} differs from the selected native Ports tool
.endif
${_ember_role}= ${_EMBER_SDK_${_ember_role}}
.endfor
CPPFLAGS+= ${_EMBER_SDK_CPPFLAGS}
CFLAGS+= ${_EMBER_SDK_CFLAGS}
CXXFLAGS+= ${_EMBER_SDK_CXXFLAGS}
LDFLAGS+= ${_EMBER_SDK_LDFLAGS}
NATIVE_CC= ${_EMBER_NATIVE_CC_COMMAND}
NATIVE_CXX= ${_EMBER_NATIVE_CXX_COMMAND}
NATIVE_CPP= ${_EMBER_NATIVE_CPP_COMMAND}
CONFIGURE_ENV+= CC_FOR_BUILD=${NATIVE_CC:Q} CXX_FOR_BUILD=${NATIVE_CXX:Q} CPP_FOR_BUILD=${NATIVE_CPP:Q}
.if ${EMBERBSD_HOST_COMPILER_FAMILY} == "clang"
CLANGBASE= ${EMBERBSD_HOST_PREFIX}
.if ${CLANGBASE} != ${EMBERBSD_HOST_PREFIX}
.error CLANGBASE differs from the selected native Ports prefix
.endif
# pkgsrc's Clang module reduces CC and CXX to the names of their cwrappers,
# not CPP. The selected absolute clang-cpp would then bypass the cpp
# wrapper, which runs the same clang-cpp (PKG_CPP) with the buildlink
# include transforms: g-ir-scanner's preprocessor run did not find
# gettext-lib's include/gettext/libintl.h as libintl.h. Use the wrapper.
.if ${CPP} == ${CLANGBASE}/bin/clang-cpp
CPP= clang-cpp
.endif
USE_NATIVE_GCC= no
USE_PKGSRC_GCC= no
.if ${USE_NATIVE_GCC:tl} != "no" || ${USE_PKGSRC_GCC:tl} != "no"
.error The Clang native profile cannot select a GCC provider
.endif
.else
# GCC_REQD is a major.minor floor; the pinned recipe supplies GCC 16.2.0.
GCC_REQD+= 16.2
# Require the C++ modules allocation repair without changing the version floor.
BUILDLINK_API_DEPENDS.gcc16+= gcc16>=16.2.0nb1
USE_PKGSRC_GCC= yes
USE_NATIVE_GCC= no
.if ${PKGSRC_COMPILER:[-1]} != "gcc" || \
    !empty(PKGSRC_COMPILER:Ngcc:Nccache:Ndistcc) || \
    ${USE_PKGSRC_GCC:tl} != "yes" || ${USE_NATIVE_GCC:tl} != "no"
PKG_FAIL_REASON+= "The common tools profile requires the selected pkgsrc GCC 16.2 compiler"
.endif
.if !empty(.MAKEOVERRIDES:MGCC_REQD) && \
    (empty(GCC_REQD:M16.2) || !empty(GCC_REQD:M16.2.*))
PKG_FAIL_REASON+= "The common tools profile requires GCC_REQD=16.2 (major.minor), not a patch version or older floor"
.endif
# gcc.mk otherwise forces yes on NetBSD, adding separate gcc16-libs/specs.
# Keep the complete always-libgcc compiler package and its own driver RPATH.
.if ${USE_PKGSRC_GCC_RUNTIME:Uno:tl} != "no"
PKG_FAIL_REASON+= "The common tools profile requires the complete gcc16 runtime; USE_PKGSRC_GCC_RUNTIME must be no"
.endif
.MAKEFLAGS: USE_PKGSRC_GCC_RUNTIME=no
BUILDLINK_DEPMETHOD.gcc16= full
.if ${BUILDLINK_DEPMETHOD.gcc16} != "full"
PKG_FAIL_REASON+= "The common tools profile requires a full dependency on the complete gcc16 package"
.endif
.endif
PYTHON_VERSION_REQD= 315
PYTHON_VERSION_DEFAULT= 315
MESON_REQD+= 1.12.1
# Matching standalone test support is part of the common LLVM family.
PKG_OPTIONS.llvm+= tests
PKG_OPTIONS.clang+= tests
PKG_OPTIONS.lld+= tests
MAKE_JOBS?= 1
.include "${.PARSEDIR}/EMBERBSD-DEFAULTS-MK.CONF"
.endif
