# SPDX-License-Identifier: BSD-2-Clause
# Origin: EmberBSD (AI-assisted). Include after the common build-tools
# cross profile and the private host bootstrap MAKECONF.
# Console toolchain for AI agents (E17). pkgsrc recipes here stay
# current; versions only move forward.
.if defined(BSD_PKG_MK)
# Graphviz pulls ghostscript-agpl through its PDF/PS renderers; AGPL-3
# is a free license (reviewed for the board kit, source stays available
# with the package).
ACCEPTABLE_LICENSES+=	gnu-agpl-v3
# Script-interpreter substitutions must not carry build-host paths.
TOOLS_PLATFORM.sh=	/bin/sh
TOOLS_PLATFORM.awk=	/usr/bin/awk
.endif
# OpenSSL's ./config probes the build host and picks darwin64-arm64 with
# the macOS -arch flag; hand it the cross target explicitly.
.  if ${PKGPATH:U} == "security/openssl" && ${USE_CROSS_COMPILE:U:tl} == "yes"
CONFIGURE_ENV+=	PERL=/usr/bin/perl
.    endif
.  endif
