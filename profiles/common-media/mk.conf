# Include after common-tools/common-graphics in a staging build's private MAKECONF.
# Source candidate only; native package and consumer acceptance is mandatory.
.if defined(BSD_PKG_MK)
# Cross pkgsrc recursively builds native tools with USE_CROSS_COMPILE=no.
# Keep the target provider policy out of those host tool builds.
.if ${EMBERBSD_COMMON_GRAPHICS_CROSS:Uno:tl} != "yes" || ${USE_CROSS_COMPILE:Uno:tl} != "no"
EMBERBSD_COMMON_MEDIA= yes
.if ${EMBERBSD_COMMON_TOOLS:Uno} != "yes" || ${EMBERBSD_COMMON_GRAPHICS:Uno} != "yes"
PKG_FAIL_REASON+= "The common media profile requires common tools and graphics"
.endif
.if !exists(${.PARSEDIR}/EMBERBSD-COMMON-MEDIA-SOURCES)
PKG_FAIL_REASON+= "The common media recipes must be prepared together"
.endif
.if ${PKGPATH:U} == "multimedia/ffmpeg" || \
    !empty(PKGPATH:Mmultimedia/ffmpeg[0-8]) || !empty(PKGPATH:Mmultimedia/ffplay[0-8])
PKG_FAIL_REASON+= "The common media profile requires FFmpeg 9; migrate this consumer"
.endif
.if ${PKGPATH:U} == "multimedia/ffmpeg9" && defined(DISTNAME) && ${DISTNAME:U} != "ffmpeg-9.0.2"
PKG_FAIL_REASON+= "The common media profile requires the FFmpeg 9.0.2 recipe"
.endif
.if ${BUILDLINK_PKGSRCDIR.ffmpeg9:U../../multimedia/ffmpeg9} != "../../multimedia/ffmpeg9"
PKG_FAIL_REASON+= "The common media profile rejects an unprepared FFmpeg provider"
.endif
.for kind in API ABI
.if !empty(.MAKEOVERRIDES:MBUILDLINK_${kind}_DEPENDS.ffmpeg9)
PKG_FAIL_REASON+= "The common media profile rejects overridden FFmpeg requirements"
.endif
.endfor
.if ${PKGPATH:U} == "multimedia/ffmpeg9" && !empty(.MAKEOVERRIDES:MCONFIGURE_ARGS)
PKG_FAIL_REASON+= "Select FFmpeg features through package options, not configure overrides"
.endif
.endif
.endif
