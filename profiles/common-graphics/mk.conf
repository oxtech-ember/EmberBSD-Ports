# Include after the native common-tools profile or its explicit cross profile.
# Source candidate only; target package and consumer acceptance is mandatory.
.if defined(BSD_PKG_MK)
# pkgsrc reuses the cross MAKECONF with USE_CROSS_COMPILE=no for native
# tool dependencies and their dependencies. Keep those host builds native.
# The ordinary native graphics profile, without this cross opt-in, stays strict.
.if ${EMBERBSD_COMMON_GRAPHICS_CROSS:Uno:tl} != "yes" || ${USE_CROSS_COMPILE:Uno:tl} != "no"
EMBERBSD_COMMON_GRAPHICS= yes
.if ${USE_CROSS_COMPILE:Uno:tl} == "yes"
# The NetBSD base shell is outside the packages-only application sysroot.
CHECK_INTERPRETER_BASE_PATHS+= /bin/sh
.if ${EMBERBSD_COMMON_GRAPHICS_CROSS:Uno:tl} != "yes"
PKG_FAIL_REASON+= "The common graphics cross build requires EMBERBSD_COMMON_GRAPHICS_CROSS=yes"
.endif
.if empty(EMBERBSD_CROSS_TOOLS:M/*) || empty(EMBERBSD_CROSS_SYSROOT:M/*) || \
    empty(EMBERBSD_CROSS_HOST_PREFIX:M/*) || \
    "${TOOLDIR:U}" != "${EMBERBSD_CROSS_TOOLS:U}" || \
    "${CROSS_DESTDIR:U}" != "${EMBERBSD_CROSS_SYSROOT:U}" || \
    ${PKGSRC_COMPILER:U} != "gcc" || ${USE_NATIVE_GCC:Uno:tl} != "yes" || \
    ${USE_PKGSRC_GCC:Uyes:tl} != "no" || ${USE_PKGSRC_GCC_RUNTIME:Uyes:tl} != "no"
PKG_FAIL_REASON+= "The common graphics cross build requires the common build-tools cross profile"
.endif
PYTHON_VERSION_REQD= 315
PYTHON_VERSION_DEFAULT= 315
MESON_REQD+= 1.12.1
PKG_OPTIONS.llvm+= tests
.if ${PKGPATH:U} == "x11/libxshmfence"
# autoreconf invokes libtoolize by name. pkgsrc has no USE_TOOLS mapping
# for it, and cross PATH does not contain the native TOOLBASE/bin.
# USE_LIBTOOL already supplies the selected host libtool-base package.
TOOLS_CREATE+= libtoolize
TOOLS_PATH.libtoolize= ${TOOLBASE}/bin/libtoolize
.endif
# CMake dependencies such as libepoll-shim must configure for the target too.
# Build-time programs stay native; headers/libraries/packages stay isolated.
CMAKE_CONFIGURE_ARGS+= -DCMAKE_SYSTEM_NAME:STRING=${CROSS_OPSYS:Q}
CMAKE_CONFIGURE_ARGS+= -DCMAKE_SYSTEM_PROCESSOR:STRING=${CROSS_MACHINE_ARCH:Q}
CMAKE_CONFIGURE_ARGS+= -DCMAKE_SYSROOT:PATH=${CROSS_DESTDIR:Q}
CMAKE_CONFIGURE_ARGS+= -DCMAKE_FIND_ROOT_PATH:STRING=${BUILDLINK_DIR:Q}\;${CROSS_DESTDIR:Q}
CMAKE_CONFIGURE_ARGS+= -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM:STRING=NEVER
CMAKE_CONFIGURE_ARGS+= -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY:STRING=ONLY
CMAKE_CONFIGURE_ARGS+= -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE:STRING=ONLY
CMAKE_CONFIGURE_ARGS+= -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE:STRING=ONLY
.if ${PKGPATH:U} == "devel/libepoll-shim"
.if "${EMBERBSD_EPOLL_ZERO_TIMER_EXITCODE:U}" != "0" && "${EMBERBSD_EPOLL_ZERO_TIMER_EXITCODE:U}" != "1"
PKG_FAIL_REASON+= "Cross libepoll-shim requires the measured EMBERBSD_EPOLL_ZERO_TIMER_EXITCODE=0 or 1"
.else
CMAKE_CONFIGURE_ARGS+= -DALLOWS_ONESHOT_TIMERS_WITH_TIMEOUT_ZERO_EXITCODE:STRING=${EMBERBSD_EPOLL_ZERO_TIMER_EXITCODE}
.endif
.endif
# Build current X11 clients/protocols in the target sysroot, independently of
# the build host's absent NetBSD base X11 directories.
X11_TYPE= modular
.if ${X11_TYPE} != "modular"
PKG_FAIL_REASON+= "The common graphics cross profile requires modular target X11"
.endif
.if defined(EMBERBSD_GRAPHICS_LLVM_CONFIG)
.if empty(EMBERBSD_GRAPHICS_LLVM_CONFIG:M/*) || \
    ${EMBERBSD_GRAPHICS_LLVM_CONFIG:T} != "llvm-config" || \
    !exists(${EMBERBSD_GRAPHICS_LLVM_CONFIG}) || \
    !exists(${EMBERBSD_GRAPHICS_LLVM_CONFIG:H:H}/inputs.sha256) || \
    !exists(${EMBERBSD_GRAPHICS_LLVM_CONFIG:H:H}/receipt.json)
PKG_FAIL_REASON+= "The graphics LLVM helper must be an absolute receipt-guarded llvm-config"
.endif
.if defined(LLVM_CONFIG_PATH) && ${LLVM_CONFIG_PATH} != ${EMBERBSD_GRAPHICS_LLVM_CONFIG}
PKG_FAIL_REASON+= "The graphics cross profile rejects an overridden LLVM_CONFIG_PATH"
.endif
LLVM_CONFIG_PATH= ${EMBERBSD_GRAPHICS_LLVM_CONFIG}
.elif ${PKGPATH:U} == "graphics/MesaLib"
PKG_FAIL_REASON+= "Cross Mesa requires EMBERBSD_GRAPHICS_LLVM_CONFIG from the target metadata helper"
.endif
.if ${PKGPATH:U} == "graphics/MesaLib" || ${PKGPATH:U} == "devel/wayland-protocols" || ${PKGPATH:U} == "wayland/wlroots"
.if !defined(EMBERBSD_WAYLAND_SCANNER)
PKG_FAIL_REASON+= "Cross graphics consumers require EMBERBSD_WAYLAND_SCANNER from the matching host scanner build"
.endif
.endif
.if ${PKGPATH:U} == "wayland/wlroots"
# The first consumer proof is deliberately smaller than a desktop package.
# Default/full retains all recipe options; the interim selector is explicit.
EMBERBSD_WLROOTS_PROFILE?= full
.if ${EMBERBSD_WLROOTS_PROFILE} == "headless-gles2"
.if !empty(.MAKEOVERRIDES:MPKG_OPTIONS.wlroots)
PKG_FAIL_REASON+= "The headless-gles2 wlroots profile rejects option overrides"
.endif
PKG_OPTIONS.wlroots= glesv2 -vulkan -drm -libinput -x11 -session -color-management -libliftoff -examples -xwayland -xcb-errors
.elif ${EMBERBSD_WLROOTS_PROFILE} == "drm-gles2"
.if !empty(.MAKEOVERRIDES:MPKG_OPTIONS.wlroots)
PKG_FAIL_REASON+= "The drm-gles2 wlroots profile rejects option overrides"
.endif
# An explicit DRM/input/color stage before the separate Vulkan/X11 closure.
PKG_OPTIONS.wlroots= glesv2 -vulkan drm libinput -x11 session color-management libliftoff -examples -xwayland -xcb-errors
.elif ${EMBERBSD_WLROOTS_PROFILE} != "full"
PKG_FAIL_REASON+= "EMBERBSD_WLROOTS_PROFILE must be full, headless-gles2 or drm-gles2"
.endif
.endif
.else
MAKE_JOBS= 1
.if ${EMBERBSD_COMMON_TOOLS:Uno} != "yes"
PKG_FAIL_REASON+= "The common graphics profile requires common build-tools"
.endif
.endif
.if !exists(${.PARSEDIR}/EMBERBSD-COMMON-GRAPHICS-SOURCES) || \
    !exists(${.PARSEDIR}/EMBERBSD-COMMON-TOOLS-MK.CONF)
PKG_FAIL_REASON+= "The common graphics recipes and tools must be prepared together"
.endif
# bsd.prefs.mk commits MACHINE_ARCH=CROSS_MACHINE_ARCH after MAKECONF returns.
# Expand these guards when pkgsrc checks PKG_FAIL_REASON, using the final target.
_EMBER_GRAPHICS_PLATFORM_SUPPORTED= ${"${OPSYS:U}" == "NetBSD" && "${OS_VERSION:M11.*}" != "" && ("${MACHINE_ARCH:U}" == "aarch64" || "${MACHINE_ARCH:U}" == "x86_64"):?yes:no}
_EMBER_GRAPHICS_CROSS_TARGET_MATCHES= ${"${USE_CROSS_COMPILE:Uno:tl}" != "yes" || ("${CROSS_MACHINE_ARCH:U}" == "${MACHINE_ARCH:U}" && "${CROSS_OPSYS:U}" == "NetBSD"):?yes:no}
PKG_FAIL_REASON+= ${"${_EMBER_GRAPHICS_PLATFORM_SUPPORTED}" != "yes":?"The common graphics candidate supports NetBSD 11/AArch64 and amd64 only":${"${_EMBER_GRAPHICS_CROSS_TARGET_MATCHES}" != "yes":?"The common graphics cross target must match the selected NetBSD architecture":}}
.if ${USE_CROSS_COMPILE:Uno:tl} == "yes"
# MAKECONF is read before bsd.prefs.mk swaps host LOCALBASE for CROSS_LOCALBASE.
.if "${CROSS_LOCALBASE:U}" != "/usr/pkg" || "${PREFIX:U/usr/pkg}" != "/usr/pkg" || \
    (!empty(.MAKEOVERRIDES:MLOCALBASE) && "${LOCALBASE:U}" != "/usr/pkg")
PKG_FAIL_REASON+= "The common graphics candidate requires one final /usr/pkg prefix"
.endif
.elif "${PREFIX:U/usr/pkg}" != "/usr/pkg" || "${LOCALBASE:U/usr/pkg}" != "/usr/pkg"
PKG_FAIL_REASON+= "The common graphics candidate requires one final /usr/pkg prefix"
.endif
.if !empty(.MAKEOVERRIDES:MMESON_ARGS) || !empty(.MAKEOVERRIDES:MMESON_NATIVE_ARGS)
PKG_FAIL_REASON+= "The common graphics profile rejects command-line Meson configuration overrides"
.endif
.for pair in MesaLib:graphics/MesaLib libdrm:x11/libdrm llvm:lang/llvm libffi:devel/libffi
.if ${BUILDLINK_PKGSRCDIR.${pair:C/:.*//}:U../../${pair:C/^[^:]*://}} != "../../${pair:C/^[^:]*://}"
PKG_FAIL_REASON+= "The common graphics profile rejects unprepared ${pair:C/:.*//} recipe paths"
.endif
.endfor
.for provider in MesaLib libdrm llvm libffi
.for kind in API ABI
.if !empty(.MAKEOVERRIDES:MBUILDLINK_${kind}_DEPENDS.${provider})
PKG_FAIL_REASON+= "The common graphics profile rejects overridden ${provider} dependency requirements"
.endif
.endfor
.endfor
.if defined(PYTHONBIN) && ${PYTHONBIN} != "/usr/pkg/bin/python3.15"
PKG_FAIL_REASON+= "The common graphics profile requires the canonical Python 3.15 interpreter"
.endif
.if ${USE_CROSS_COMPILE:Uno:tl} != "yes" && defined(LLVM_CONFIG_PATH) && ${LLVM_CONFIG_PATH} != "/usr/pkg/bin/llvm-config"
PKG_FAIL_REASON+= "The common graphics profile requires canonical LLVM metadata"
.endif
.if defined(TOOL_PYTHONBIN) && ${TOOL_PYTHONBIN} != "${TOOLBASE:U/usr/pkg}/bin/python3.15"
PKG_FAIL_REASON+= "The common graphics profile requires the canonical build-host Python 3.15 interpreter"
.endif
.for provider in MesaLib libdrm glu
.if ${USE_BUILTIN.${provider}:Uno:tl} != "no"
PKG_FAIL_REASON+= "The common graphics profile rejects built-in ${provider}"
.endif
USE_BUILTIN.${provider}= no
.endfor
BUILDLINK_API_DEPENDS.MesaLib+= MesaLib>=26.2.5nb5
BUILDLINK_ABI_DEPENDS.MesaLib+= MesaLib>=26.2.5nb5
BUILDLINK_API_DEPENDS.libdrm+= libdrm>=2.4.134nb5
BUILDLINK_ABI_DEPENDS.libdrm+= libdrm>=2.4.134nb5
BUILDLINK_API_DEPENDS.libffi+= libffi>=3.8.0nb1
BUILDLINK_ABI_DEPENDS.libffi+= libffi>=3.8.0nb1
.if ${PKGPATH:U} == "devel/libffi" && \
    (${DISTNAME:U} != "libffi-3.8.0" || ${PKGREVISION:U} != "1")
PKG_FAIL_REASON+= "The common graphics profile requires rebased libffi 3.8.0nb1"
.endif
.if ${PKGPATH:U} == "graphics/MesaLib" && ${DISTNAME:U} != "mesa-26.2.5"
PKG_FAIL_REASON+= "The common graphics profile rejects old Mesa recipes"
.endif
.if ${PKGPATH:U} == "x11/libdrm" && \
    (${DISTNAME:U} != "libdrm-2.4.134" || ${PKGREVISION:U} != "5")
PKG_FAIL_REASON+= "The common graphics profile requires adapted libdrm 2.4.134nb5"
.endif
.if ${PKGPATH:U} == "lang/libLLVM" || !empty(PKGPATH:Mlang/llvm[0-9]*)
PKG_FAIL_REASON+= "The common graphics profile requires canonical shared LLVM 23"
.endif
.for feature in OSMESA XA
.if ${MESALIB_SUPPORTS_${feature}:Uno:tl} == "yes"
PKG_FAIL_REASON+= "The common graphics candidate does not provide ${feature}"
.endif
.endfor
.endif
.endif
