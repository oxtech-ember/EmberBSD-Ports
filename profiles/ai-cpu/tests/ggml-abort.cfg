<?xml version="1.0"?>
<def format="2">
  <!-- Origin: EmberBSD, AI-assisted. SPDX-License-Identifier: BSD-2-Clause -->
  <!--
    ggml.h declares ggml_abort _Noreturn. ggml.c always ends in abort().
    The three fixed arguments and printf-format argument match its variadic
    signature. A noreturn-only model does not match these calls in Cppcheck
    2.17.1. This contract removes false continuation paths after GGML_ASSERT
    and GGML_ABORT. It does not suppress any diagnostic category.
  -->
  <function name="ggml_abort">
    <noreturn>true</noreturn>
    <arg nr="1" direction="in">
      <not-null/>
      <not-uninit/>
      <strz/>
    </arg>
    <arg nr="2" direction="in"><not-uninit/></arg>
    <formatstr/>
    <arg nr="3" direction="in">
      <formatstr/>
      <not-null/>
      <not-uninit/>
      <strz/>
    </arg>
  </function>
</def>
