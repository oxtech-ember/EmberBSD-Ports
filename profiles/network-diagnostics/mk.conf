# SPDX-License-Identifier: BSD-2-Clause
# Origin: EmberBSD (AI-assisted). Include after the common build-tools
# cross profile and the private host bootstrap MAKECONF.
# Network diagnostics kit: CLI capture, analysis and load tools for boards.
.if defined(BSD_PKG_MK)
# tcpdump keeps its suggested crypto build; libsmi stays off.
# Wireshark ships the CLI kit only: keep HTTP/2 dissection, drop the Qt
# GUI, Lua, HTTP/3, iLBC, spandsp and documentation from the board kit.
# Suggested options stay additive in pkgsrc, so each one is negated
# explicitly to keep the dependency closure free of Qt and X11.
# Lua dissectors remain a separate queue item with their own validation.
PKG_OPTIONS.wireshark=	http2 -http3 -lua -qt6 -qt5 -ilbc -spandsp -doc
# CMake consumers (libcares, wireshark) must configure for the target;
# the same setting the common graphics cross profile applies.
.  if ${USE_CROSS_COMPILE:U:tl} == "yes"
CMAKE_CONFIGURE_ARGS+= -DCMAKE_SYSTEM_NAME:STRING=${CROSS_OPSYS:Q}
CMAKE_CONFIGURE_ARGS+= -DCMAKE_SYSTEM_PROCESSOR:STRING=${CROSS_MACHINE_ARCH:Q}
CMAKE_CONFIGURE_ARGS+= -DCMAKE_SYSROOT:PATH=${CROSS_DESTDIR:Q}
CMAKE_CONFIGURE_ARGS+= -DCMAKE_FIND_ROOT_PATH:STRING=${CROSS_DESTDIR:Q}\;${BUILDLINK_DIR:Q}
CMAKE_CONFIGURE_ARGS+= -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM:STRING=NEVER
CMAKE_CONFIGURE_ARGS+= -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY:STRING=ONLY
CMAKE_CONFIGURE_ARGS+= -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE:STRING=ONLY
CMAKE_CONFIGURE_ARGS+= -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE:STRING=ONLY
.  endif
# libgpg-error and libgcrypt recipes append CC_FOR_BUILD=${NATIVE_CC}
# (configure argument for libgcrypt) after the common cross profile; an
# empty NATIVE_CC falls back to bare "gcc", which the wrappers resolve to
# the target compiler, so build-time generators become target binaries.
# Same repair the graphics profile applies to libX11.
.  if ${PKGPATH:U} == "security/libgpg-error" || ${PKGPATH:U} == "security/libgcrypt"
NATIVE_CC=	${EMBERBSD_CROSS_BUILD_CC}
.  endif
# REPLACE_SH bakes the sh tool path into installed target scripts; the
# host bootstrap mksh would leak into them. The sysroot provides the
# target /bin/sh, and the supported Darwin host also runs build scripts
# through its own /bin/sh.
TOOLS_PLATFORM.sh=	/bin/sh
# Same treatment for awk that target scripts bake in (libsmi's smistrip):
# the supported Darwin host and the target sysroot both provide
# /usr/bin/awk, so the substituted path stays valid on both sides.
TOOLS_PLATFORM.awk=	/usr/bin/awk
# libsmi ships an Erlang/ESDL-derived data file under this permissive
# license (retain notices, no warranty, MIT-style); reviewed for the kit.
ACCEPTABLE_LICENSES+=	esdl-license
.endif
