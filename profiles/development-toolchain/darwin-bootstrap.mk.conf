# Origin: EmberBSD (AI-assisted). Scoped native producer policy.
# Include this file from the SDK-pinned MAKECONF. It is read before discovery.
.if !defined(_EMBERBSD_DARWIN_BOOTSTRAP_POLICY)
.if ${EMBERBSD_DARWIN_BOOTSTRAP:Uno} != "yes"
.error "Select EMBERBSD_DARWIN_BOOTSTRAP=yes in the initial make command"
.endif

# Clang is the ordinary compiler. GCC is an explicit platform choice.
EMBERBSD_COMPILER_FAMILY?= clang
.if ${EMBERBSD_COMPILER_FAMILY} != "clang" && ${EMBERBSD_COMPILER_FAMILY} != "gcc"
.error "EMBERBSD_COMPILER_FAMILY must be clang or gcc"
.endif
.if ${EMBERBSD_COMPILER_FAMILY} == "gcc"
# Preserve the existing GCC producer interface only for its explicit route.
.  for _ember_input in SEED_CC SEED_CXX SEED_CPP LLVM_MC LD64_LLD DSYMUTIL AR RANLIB NM STRIP UNAME
.    if !defined(EMBERBSD_DARWIN_${_ember_input}) && defined(EMBERBSD_GCC16_${_ember_input})
EMBERBSD_DARWIN_${_ember_input}= ${EMBERBSD_GCC16_${_ember_input}}
.    else
EMBERBSD_GCC16_${_ember_input}= ${EMBERBSD_DARWIN_${_ember_input}}
.    endif
.  endfor
.  if !defined(EMBERBSD_DARWIN_SDK_VERSION) && defined(EMBERBSD_GCC16_DARWIN_SDK_VERSION)
EMBERBSD_DARWIN_SDK_VERSION= ${EMBERBSD_GCC16_DARWIN_SDK_VERSION}
.  else
EMBERBSD_GCC16_DARWIN_SDK_VERSION= ${EMBERBSD_DARWIN_SDK_VERSION}
.  endif
EMBERBSD_DARWIN_SEED_AS?= ${EMBERBSD_DARWIN_LLVM_MC}
.endif

# Initial tools permit absent optional Darwin operations. Full remains default.
EMBERBSD_DARWIN_TOOL_PHASE?= full
.if ${EMBERBSD_DARWIN_TOOL_PHASE} != "full" && ${EMBERBSD_DARWIN_TOOL_PHASE} != "initial"
.error "EMBERBSD_DARWIN_TOOL_PHASE must be initial or full"
.endif
.if ${EMBERBSD_DARWIN_TOOL_PHASE} == "full"
# The final source fetcher must use the SDK OpenSSL and its installed CA store.
PKG_OPTIONS.libfetch+= openssl
.endif

# The SDK verifies these facts against the actual host. They are not SDK versions.
.for _ember_fact in OS CPU KERNEL_VERSION PRODUCT_VERSION PKGSRC_OPSYS_VERSION
.  if !defined(EMBERBSD_DARWIN_HOST_${_ember_fact}) || empty(EMBERBSD_DARWIN_HOST_${_ember_fact})
.error "Supply accepted actual host fact EMBERBSD_DARWIN_HOST_${_ember_fact}"
.  endif
.endfor
.if ${EMBERBSD_DARWIN_HOST_OS} != "Darwin" || ${EMBERBSD_DARWIN_HOST_CPU} != "aarch64"
.error "This scoped bootstrap policy requires a Darwin AArch64 host"
.endif
.if !empty(EMBERBSD_DARWIN_HOST_PKGSRC_OPSYS_VERSION:C/[0-9]//g)
.error "Supply the accepted numeric pkgsrc host OS version"
.endif
.if ${USE_CROSS_COMPILE:Uno:tl} != "no"
.error "The Darwin native bootstrap policy does not select a cross target"
.endif
# Replace stale detection values with this plan's accepted facts.
NATIVE_OPSYS= ${EMBERBSD_DARWIN_HOST_OS}
NATIVE_OS_VERSION= ${EMBERBSD_DARWIN_HOST_KERNEL_VERSION}
NATIVE_OPSYS_VERSION= ${EMBERBSD_DARWIN_HOST_PKGSRC_OPSYS_VERSION}
MACHINE_ARCH= ${EMBERBSD_DARWIN_HOST_CPU}
OSX_VERSION= ${EMBERBSD_DARWIN_HOST_PRODUCT_VERSION:C/^([0-9]+\.[0-9]+).*/\1/}

# Each path and every command word must be validated by the SDK first.
# The make layer does not discover a replacement for a missing input.
.for _ember_path in EMBERBSD_DARWIN_SH EMBERBSD_DARWIN_UTILITY_BIN WRKOBJDIR DISTDIR PACKAGES LOCALBASE PKG_DBDIR OSX_SDK_PATH
.  if !defined(${_ember_path}) || ${${_ember_path}:[#]} != 1 || empty(${_ember_path}:M/*)
.error "Supply an accepted absolute path for ${_ember_path}"
.  endif
.endfor
.if !empty(OSX_SDK_PATH:M*,*)
.error "The accepted macOS SDK path cannot contain a comma in a -Wl argument"
.endif
.if !exists(${OSX_SDK_PATH}/usr/lib/libiconv.tbd)
.error "The accepted macOS SDK must provide usr/lib/libiconv.tbd"
.endif
.for _ember_command in EMBERBSD_DARWIN_MAKE EMBERBSD_DARWIN_GMAKE EMBERBSD_DARWIN_SEED_CC EMBERBSD_DARWIN_SEED_CXX EMBERBSD_DARWIN_SEED_CPP EMBERBSD_DARWIN_SEED_AS
.  if !defined(${_ember_command}) || empty(${_ember_command}:M/*)
.error "Supply accepted command ${_ember_command}"
.  endif
.endfor
.for _ember_tool in LLVM_MC LD64_LLD DSYMUTIL AR RANLIB NM STRIP
.  if !defined(EMBERBSD_DARWIN_${_ember_tool}) || \
      ${EMBERBSD_DARWIN_${_ember_tool}:[#]} != 1 || \
      empty(EMBERBSD_DARWIN_${_ember_tool}:M/*)
.error "Supply selected tool EMBERBSD_DARWIN_${_ember_tool}"
.  endif
.endfor
.if !defined(EMBERBSD_DARWIN_SDK_VERSION) || empty(EMBERBSD_DARWIN_SDK_VERSION)
.error "Supply the SDK version from the accepted native ABI metadata"
.endif
.if !defined(MACOSX_DEPLOYMENT_TARGET) || empty(MACOSX_DEPLOYMENT_TARGET)
.error "Supply the deployment value from the selected compiler command"
.endif
.for _ember_jobs in EMBERBSD_DARWIN_JOBS EMBERBSD_DARWIN_CPU_BUDGET
.  if !defined(${_ember_jobs}) || ${${_ember_jobs}:[#]} != 1 || \
      empty(${_ember_jobs}:M[1-9]*) || !empty(${_ember_jobs}:C/[0-9]//g)
.error "Supply one positive decimal integer for ${_ember_jobs}"
.  endif
.endfor
.if ${EMBERBSD_DARWIN_JOBS} > ${EMBERBSD_DARWIN_CPU_BUDGET}
.error "EMBERBSD_DARWIN_JOBS exceeds the accepted CPU budget"
.endif
.if ${EMBERBSD_DARWIN_JOBS} > 1 && ${EMBERBSD_COMPILER_FAMILY} == "gcc"
.  if !defined(EMBERBSD_GCC16_LINKER_LAUNCHER) || empty(EMBERBSD_GCC16_LINKER_LAUNCHER:M/*)
.error "Parallel GCC bootstrap requires the accepted SDK link launcher"
.  endif
.endif

# CMake uses the same service as a command list. Its owner fragment forwards it.
.if ${EMBERBSD_DARWIN_JOBS} > 1 && \
    (!defined(EMBERBSD_DARWIN_CMAKE_LINKER_LAUNCHER) || empty(EMBERBSD_DARWIN_CMAKE_LINKER_LAUNCHER))
.error "Parallel CMake bootstrap requires the accepted SDK link launcher list"
.endif

# Utilities execute during parsing. Source providers are explicit future edges.
# The SDK verifies each native path and the contents of the utility PATH directory.
_EMBERBSD_DARWIN_EARLY_TOOLS= awk basename cat cut date dirname env expr grep head id pwd sed sort tail tr uname uniq wc
.for _ember_tool in ${_EMBERBSD_DARWIN_EARLY_TOOLS}
.  if empty(EMBERBSD_DARWIN_NATIVE_TOOLS:M${_ember_tool})
.error "Select accepted parse-time utility ${_ember_tool}"
.  endif
.endfor
.for _ember_tool in ${EMBERBSD_DARWIN_NATIVE_TOOLS}
.  if !defined(EMBERBSD_DARWIN_TOOL.${_ember_tool}) || \
      ${EMBERBSD_DARWIN_TOOL.${_ember_tool}:[#]} != 1 || \
      empty(EMBERBSD_DARWIN_TOOL.${_ember_tool}:M/*)
.error "Supply accepted native utility path for ${_ember_tool}"
.  endif
.endfor
# Metadata declares future compression tools even before gzip is built.
.for _ember_tool in gzip gunzip gzcat
.  if empty(EMBERBSD_DARWIN_NATIVE_TOOLS:M${_ember_tool}) && \
      empty(EMBERBSD_DARWIN_SOURCE_TOOLS:M${_ember_tool})
.error "Select a native or shared Ports source provider for ${_ember_tool}"
.  endif
.endfor
.for _ember_tool in ADMIN INFO
.  if !defined(NATIVE_PKG_${_ember_tool}_CMD) || \
      ${NATIVE_PKG_${_ember_tool}_CMD:[#]} != 1 || \
      empty(NATIVE_PKG_${_ember_tool}_CMD:M/*)
.error "Supply accepted native pkg_${_ember_tool:tl} before package metadata"
.  endif
.endfor

# Preserve the accepted gmake tuple before any package handoff. MAKECONF can
# supply that tuple again on a later read. Do not accumulate SHELL words.
_EMBERBSD_DARWIN_INITIAL_GMAKE:= ${EMBERBSD_DARWIN_GMAKE}

# Preserve the shared work and distfile roots. The coordinator owns concurrency.
_MAKE= ${EMBERBSD_DARWIN_MAKE}
MAKE= ${EMBERBSD_DARWIN_MAKE}
SHELL= ${EMBERBSD_DARWIN_SH}
SH= ${EMBERBSD_DARWIN_SH}
CONFIG_SHELL= ${EMBERBSD_DARWIN_SH}
TOOLS_SHELL= ${EMBERBSD_DARWIN_SH}
# A simple make recipe can bypass its shell. Bind the builtin dispatcher.
EMBERBSD_DARWIN_BUILTIN_SHELL= ${EMBERBSD_DARWIN_SH}
PATH= ${EMBERBSD_DARWIN_UTILITY_BIN}
PKGSRC_COMPILER= ${EMBERBSD_COMPILER_FAMILY}
.undef _CC
.undef _GCC_VERSION
.undef _GCC_VERSION_STRING
.undef CLANG_VERSION
.undef CC_VERSION
.if ${EMBERBSD_COMPILER_FAMILY} == "gcc"
USE_NATIVE_GCC= yes
USE_PKGSRC_GCC= no
USE_PKGSRC_GCC_RUNTIME= no
.else
CLANGBASE= ${EMBERBSD_DARWIN_SEED_CC:[1]:H:H}
.endif
CC= ${EMBERBSD_DARWIN_SEED_CC}
CXX= ${EMBERBSD_DARWIN_SEED_CXX}
CPP= ${EMBERBSD_DARWIN_SEED_CPP}
AS= ${EMBERBSD_DARWIN_SEED_AS}
LD= ${EMBERBSD_DARWIN_LD64_LLD}
# ld64.lld -v says "compatible with GNU linkers", so libtool's probe takes
# it for GNU ld; configure scripts then pass ELF-only options such as
# --version-script. It is the Mach-O driver: keep libtool on the Darwin path.
CONFIGURE_ENV+= lt_cv_prog_gnu_ld=no lt_cv_prog_gnu_ldcxx=no
AR= ${EMBERBSD_DARWIN_AR}
RANLIB= ${EMBERBSD_DARWIN_RANLIB}
# Darwin build systems default to Apple "ranlib -c" (OpenSSL's darwin-common),
# which llvm-ranlib rejects. llvm-ranlib already indexes common symbols, so
# name the selected ranlib for configure scripts that honour RANLIB.
CONFIGURE_ENV+= RANLIB=${RANLIB:Q}
# Rust also consumes the native ABI SDK before invoking its selected linker.
# ALL_ENV reaches configure, build and test without ambient Apple discovery.
ALL_ENV+= SDKROOT=${OSX_SDK_PATH:Q}
NM= ${EMBERBSD_DARWIN_NM}
STRIP= ${EMBERBSD_DARWIN_STRIP}
# Configure scripts and Makefiles also run bare archive and symbol tools.
# The utility PATH has none; expose the selected commands in the tools dir.
.for _ember_tool in ar nm ranlib
TOOLS_CREATE+= ${_ember_tool}
TOOLS_PATH.${_ember_tool}= ${EMBERBSD_DARWIN_${_ember_tool:tu}}
.endfor
# mk/tools/strip.mk creates strip, or a no-op for unstripped installs.
TOOLS_PLATFORM.strip= ${EMBERBSD_DARWIN_STRIP}
# pkgsrc models bison-yacc as a command, not an executable role.
.if defined(EMBERBSD_DARWIN_TOOL.bison)
TOOLS_PLATFORM.bison-yacc= ${EMBERBSD_DARWIN_TOOL.bison} -y
.endif
COMPILER_USE_SYMLINKS= no
# Install the owned SDK prefix with pkgsrc's standard current-user policy.
UNPRIVILEGED= yes
# Keep native package state, configuration and rc scripts in the selected SDK.
VARBASE= ${LOCALBASE}/var
SYSCONFBASE= ${LOCALBASE}/etc
RCD_SCRIPTS_DIR= ${LOCALBASE}/etc/rc.d
# The final OpenSSL and its trust store belong to this SDK prefix.
PREFER.openssl= pkgsrc
PKG_SYSCONFBASEDIR= ${LOCALBASE}/etc
# The initial pkgtools bootstrap uses the canonical uncompressed package format.
# Keep checksums and required-library checks active; do not discover compressors.
PKG_COMPRESSION= none
# Keep the established shared package and feature policy.
.include "${.PARSEDIR}/EMBERBSD-DEVELOPMENT-MK.CONF"
# YJIT needs lang/rust: a foreign stage-0 binary and an unprepared LLVM
# libunwind. Build the native host Ruby without it; targets keep the default.
PKG_OPTIONS.ruby+= -ruby-yjit
# Perl is a foundation build interpreter. DTrace instrumentation is optional.
# Keep the general dtrace option available with an explicit selected provider.
PKG_OPTIONS.perl+= -dtrace
MAKE_JOBS= ${EMBERBSD_DARWIN_JOBS}
_EMBERBSD_DARWIN_BOOTSTRAP_POLICY= 1
.endif

# MAKECONF restores the accepted ABI flags on every read. Reapply these
# producer options after the one-time policy so nested reads retain them.
# These are not native ABI descriptor flags. Initial C++ providers must not
# load the seed GCC runtime DSOs or keep its default runtime search paths.
.if ${EMBERBSD_DARWIN_BOOTSTRAP:Uno} == "yes" && ${EMBERBSD_COMPILER_FAMILY} == "gcc"
.  for _ember_runtime_flag in -static-libstdc++ -static-libgcc -nodefaultrpaths
.    if empty(LDFLAGS:M${_ember_runtime_flag})
LDFLAGS+= ${_ember_runtime_flag}
.    endif
.  endfor
# Libtool may drop driver flags from shared-library commands. Apply the
# producer runtime policy in the final C/C++ wrappers, after libtool. Some
# configure probes also invoke CXX directly and omit LDFLAGS. Retain the
# LDFLAGS copy for direct compiler calls that do not use these wrappers.
.  for _ember_var _ember_wrap in CC cc CXX cxx
.    for _ember_runtime_flag in -static-libstdc++ -static-libgcc -nodefaultrpaths
.      if empty(CWRAPPERS_PREPEND.${_ember_wrap}:M${_ember_runtime_flag})
CWRAPPERS_PREPEND.${_ember_wrap}+= ${_ember_runtime_flag}
.      endif
.      if empty(_WRAP_EXTRA_ARGS.${_ember_var}:M${_ember_runtime_flag})
_WRAP_EXTRA_ARGS.${_ember_var}+= ${_ember_runtime_flag}
.      endif
.    endfor
.    if empty(CWRAPPERS_PREPEND.${_ember_wrap}:M-Wl,${OSX_SDK_PATH}/usr/lib/libiconv.tbd)
CWRAPPERS_PREPEND.${_ember_wrap}+= -Wl,${OSX_SDK_PATH}/usr/lib/libiconv.tbd
.    endif
.    if empty(_WRAP_EXTRA_ARGS.${_ember_var}:M-Wl,${OSX_SDK_PATH}/usr/lib/libiconv.tbd)
_WRAP_EXTRA_ARGS.${_ember_var}+= -Wl,${OSX_SDK_PATH}/usr/lib/libiconv.tbd
.    endif
.  endfor
# The external seed's static libstdc++ has no ordinary GCC recipe metadata
# that requests iconv. Pass the exact SDK stub in LDFLAGS for ordinary links
# and in the wrappers for compiler probes that omit LDFLAGS.
.  if empty(LDFLAGS:M-Wl,${OSX_SDK_PATH}/usr/lib/libiconv.tbd)
LDFLAGS+= -Wl,${OSX_SDK_PATH}/usr/lib/libiconv.tbd
.  endif
.endif

# MAKECONF is first read before PKGPATH. Apply package policy on its later read.
.if ${EMBERBSD_DARWIN_BOOTSTRAP:Uno} == "yes" && defined(BSD_PKG_MK)
.  if defined(PKGPATH) && !defined(_EMBERBSD_DARWIN_INSTALLER_POLICY)
.    if (${EMBERBSD_COMPILER_FAMILY} == "gcc" && ${PKGPATH} == "lang/gcc16") || \
        (${EMBERBSD_COMPILER_FAMILY} == "clang" && ${PKGPATH} == "lang/clang")
# Build the common foundation with the selected compiler closure.
# Keep the BSD -U installer distinct from the coreutils ginstall program.
BOOTSTRAP_DEPENDS+= bsdinstall>=20160108nb1:../../sysutils/bsdinstall
BOOTSTRAP_DEPENDS+= gmake>=4.4.1:../../devel/gmake
BOOTSTRAP_DEPENDS+= coreutils>=9.11:../../sysutils/coreutils
BOOTSTRAP_DEPENDS+= findutils>=4.11.0:../../sysutils/findutils
BOOTSTRAP_DEPENDS+= grep>=3.12:../../textproc/grep
BOOTSTRAP_DEPENDS+= gsed>=4.10:../../textproc/gsed
BOOTSTRAP_DEPENDS+= nawk>=20260426:../../lang/nawk
BOOTSTRAP_DEPENDS+= pkg_install>=20260227:../../pkgtools/pkg_install
BOOTSTRAP_DEPENDS+= pkg_install-info>=7.3:../../pkgtools/pkg_install-info
BOOTSTRAP_DEPENDS+= diffutils>=3.12:../../devel/diffutils
BOOTSTRAP_DEPENDS+= meson>=1.12.1:../../devel/meson
BOOTSTRAP_DEPENDS+= mozilla-rootcerts-openssl>=2.24nb1:../../security/mozilla-rootcerts-openssl
_EMBERBSD_DARWIN_INSTALLER_POLICY= 1
.    elif ${PKGPATH} == "devel/m4"
# syscmd/esyscmd execute this embedded runtime path. CONFIG_SHELL alone
# changes only configure. The target package must retain its shell provider.
DEPENDS+= mksh>=59b:../../shells/mksh
M4_SYSCMD_SHELL= ${LOCALBASE}/bin/mksh
_EMBERBSD_DARWIN_INSTALLER_POLICY= 1
.    elif ${PKGPATH} == "lang/perl5"
# The build shell follows the phase's selected host route. The runtime path
# is embedded in Perl and must name the final package's shell provider.
DEPENDS+= mksh>=59b:../../shells/mksh
PERL_BUILD_SHELL= ${EMBERBSD_DARWIN_SH}
PERL_RUNTIME_SHELL= ${LOCALBASE}/bin/mksh
_EMBERBSD_DARWIN_INSTALLER_POLICY= 1
.    elif ${PKGPATH} == "lang/nawk"
# system and both pipe directions use this installed runtime shell.
DEPENDS+= mksh>=59b:../../shells/mksh
NAWK_COMMAND_SHELL= ${LOCALBASE}/bin/mksh
_EMBERBSD_DARWIN_INSTALLER_POLICY= 1
.    elif ${PKGPATH} == "sysutils/bsdinstall"
# Its child tools must come from the final bundle, not the initial seed.
DEPENDS+= mksh>=59b:../../shells/mksh llvm>=23.1.4:../../lang/llvm
EMBERBSD_BSDINSTALL_SHELL= ${LOCALBASE}/bin/mksh
TOOLS_PLATFORM.strip= ${LOCALBASE}/bin/llvm-strip
_EMBERBSD_DARWIN_INSTALLER_POLICY= 1
.    endif
.  endif
.  if defined(PKGPATH)
# This is the only make, shell and gzip selection for Ports and the SDK.
# The initial make (EMBERBSD_DARWIN_MAKE) and shell build only the seed set:
# the closure of devel/bmake, which includes shells/mksh. Every other
# recipe depends on devel/bmake
# and runs the Ports-built bmake with its own share/mk and the Ports-built
# mksh. SHELL, SH, CONFIG_SHELL, TOOLS_SHELL, the builtin shell and
# TOOLS_PLATFORM.sh all follow EMBERBSD_DARWIN_SH. The initial gmake stays,
# with one final SHELL= word. The separate gzip seed also includes pax,
# fetch and libfetch. These build with the Ports bmake and Darwin mk files,
# but must not depend on the gzip package they help to build. Every recipe
# outside the gzip seed, except gzip itself, depends on gzip and
# runs gzip, gunzip and gzcat (its zcat) from ${LOCALBASE}, also as bare
# commands. The local seed recipes and the uncompressed gzip source need
# no initial gzip provider. Reapply runtime values on each MAKECONF read;
# add the dependencies only once.
# The builtin helper is the copy that pkgtools/bootstrap-mk-files installs.
# The SDK starts each recipe with the make and shell the devel/bmake edge
# selects.
EMBERBSD_DARWIN_SEED_MAKE_RECIPES= devel/bmake devel/nbpatch pkgtools/bootstrap-mk-files pkgtools/cwrappers pkgtools/digest pkgtools/libnbcompat pkgtools/mktools shells/mksh
EMBERBSD_DARWIN_SEED_GZIP_RECIPES= archivers/pax devel/bmake devel/nbpatch net/fetch net/libfetch pkgtools/bootstrap-mk-files pkgtools/cwrappers pkgtools/digest pkgtools/libnbcompat pkgtools/mktools shells/mksh
.    if empty(EMBERBSD_DARWIN_SEED_MAKE_RECIPES:M${PKGPATH})
.      if !defined(_EMBERBSD_DARWIN_MAKE_POLICY)
BOOTSTRAP_DEPENDS+= bmake>=20260912:../../devel/bmake
.        if empty(EMBERBSD_DARWIN_SEED_GZIP_RECIPES:M${PKGPATH}) && ${PKGPATH} != "archivers/gzip"
BOOTSTRAP_DEPENDS+= gzip>=1.15:../../archivers/gzip
USE_TOOLS+= gzip gunzip gzcat
.        endif
.      endif
# Read-only metadata keeps the accepted initial tools. Keep the dependency
# edge: it still defines the full build order.
.      if ${EMBERBSD_DARWIN_METADATA:Uno} != "yes"
_MAKE= ${LOCALBASE}/bin/bmake
MAKE= ${LOCALBASE}/bin/bmake
EMBERBSD_DARWIN_SH= ${LOCALBASE}/bin/mksh
EMBERBSD_DARWIN_GMAKE= ${_EMBERBSD_DARWIN_INITIAL_GMAKE} SHELL=${LOCALBASE}/bin/mksh
EMBERBSD_DARWIN_BUILTIN_HELPER= ${LOCALBASE}/libexec/emberbsd-darwin-builtin.sh
.        if empty(EMBERBSD_DARWIN_SEED_GZIP_RECIPES:M${PKGPATH}) && ${PKGPATH} != "archivers/gzip"
EMBERBSD_DARWIN_TOOL.gzip= ${LOCALBASE}/bin/gzip
EMBERBSD_DARWIN_TOOL.gunzip= ${LOCALBASE}/bin/gunzip
EMBERBSD_DARWIN_TOOL.gzcat= ${LOCALBASE}/bin/zcat
.        endif
.      endif
.    endif
_EMBERBSD_DARWIN_MAKE_POLICY= 1
.  endif
.endif
