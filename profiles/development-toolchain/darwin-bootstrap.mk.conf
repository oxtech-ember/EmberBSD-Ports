# Origin: EmberBSD (AI-assisted). Scoped native producer policy.
# Include this file from the SDK-pinned MAKECONF. It is read before discovery.
.if !defined(_EMBERBSD_DARWIN_BOOTSTRAP_POLICY)
.if ${EMBERBSD_DARWIN_BOOTSTRAP:Uno} != "yes"
.error "Select EMBERBSD_DARWIN_BOOTSTRAP=yes in the initial make command"
.endif

# The SDK verifies these facts against the actual host. They are not SDK versions.
.for _ember_fact in OS CPU KERNEL_VERSION PRODUCT_VERSION PKGSRC_OPSYS_VERSION
.  if !defined(EMBERBSD_DARWIN_HOST_${_ember_fact}) || empty(EMBERBSD_DARWIN_HOST_${_ember_fact})
.error "Supply accepted actual host fact EMBERBSD_DARWIN_HOST_${_ember_fact}"
.  endif
.endfor
.if ${EMBERBSD_DARWIN_HOST_OS} != "Darwin" || ${EMBERBSD_DARWIN_HOST_CPU} != "aarch64"
.error "This scoped bootstrap policy requires a Darwin AArch64 host"
.endif
.if !empty(EMBERBSD_DARWIN_HOST_PKGSRC_OPSYS_VERSION:C/[0-9]//g)
.error "Supply the accepted numeric pkgsrc host OS version"
.endif
.if ${USE_CROSS_COMPILE:Uno:tl} != "no"
.error "The Darwin native bootstrap policy does not select a cross target"
.endif
# Replace stale detection values with this plan's accepted facts.
NATIVE_OPSYS= ${EMBERBSD_DARWIN_HOST_OS}
NATIVE_OS_VERSION= ${EMBERBSD_DARWIN_HOST_KERNEL_VERSION}
NATIVE_OPSYS_VERSION= ${EMBERBSD_DARWIN_HOST_PKGSRC_OPSYS_VERSION}
MACHINE_ARCH= ${EMBERBSD_DARWIN_HOST_CPU}
OSX_VERSION= ${EMBERBSD_DARWIN_HOST_PRODUCT_VERSION:C/^([0-9]+\.[0-9]+).*/\1/}

# Each path and every command word must be validated by the SDK first.
# The make layer does not replace bundle inventories or producer acceptance.
.for _ember_path in EMBERBSD_DARWIN_SH EMBERBSD_DARWIN_UTILITY_BIN WRKOBJDIR DISTDIR PACKAGES LOCALBASE PKG_DBDIR OSX_SDK_PATH
.  if !defined(${_ember_path}) || ${${_ember_path}:[#]} != 1 || empty(${_ember_path}:M/*)
.error "Supply an accepted absolute path for ${_ember_path}"
.  endif
.endfor
.for _ember_command in EMBERBSD_DARWIN_MAKE EMBERBSD_DARWIN_GMAKE EMBERBSD_GCC16_SEED_CC EMBERBSD_GCC16_SEED_CXX EMBERBSD_GCC16_SEED_CPP
.  if !defined(${_ember_command}) || empty(${_ember_command}:M/*)
.error "Supply accepted command ${_ember_command}"
.  endif
.endfor
.for _ember_tool in LLVM_MC LD64_LLD DSYMUTIL AR RANLIB NM STRIP
.  if !defined(EMBERBSD_GCC16_${_ember_tool}) || \
      ${EMBERBSD_GCC16_${_ember_tool}:[#]} != 1 || \
      empty(EMBERBSD_GCC16_${_ember_tool}:M/*)
.error "Supply accepted tool EMBERBSD_GCC16_${_ember_tool}"
.  endif
.endfor
.if !defined(EMBERBSD_GCC16_DARWIN_SDK_VERSION) || empty(EMBERBSD_GCC16_DARWIN_SDK_VERSION)
.error "Supply the SDK version from the accepted native ABI metadata"
.endif
.if !defined(MACOSX_DEPLOYMENT_TARGET) || empty(MACOSX_DEPLOYMENT_TARGET)
.error "Supply the accepted deployment value from the fixed GCC binding"
.endif
.for _ember_jobs in EMBERBSD_DARWIN_JOBS EMBERBSD_DARWIN_CPU_BUDGET
.  if !defined(${_ember_jobs}) || ${${_ember_jobs}:[#]} != 1 || \
      empty(${_ember_jobs}:M[1-9]*) || !empty(${_ember_jobs}:C/[0-9]//g)
.error "Supply one positive decimal integer for ${_ember_jobs}"
.  endif
.endfor
.if ${EMBERBSD_DARWIN_JOBS} > ${EMBERBSD_DARWIN_CPU_BUDGET}
.error "EMBERBSD_DARWIN_JOBS exceeds the accepted CPU budget"
.endif
.if ${EMBERBSD_DARWIN_JOBS} > 1
.  if !defined(EMBERBSD_GCC16_LINKER_LAUNCHER) || empty(EMBERBSD_GCC16_LINKER_LAUNCHER:M/*)
.error "Parallel GCC bootstrap requires the accepted SDK link launcher"
.  endif
.endif

# Utilities execute during parsing. Source providers are explicit future edges.
# The SDK verifies each native path and the contents of the utility PATH directory.
_EMBERBSD_DARWIN_EARLY_TOOLS= awk basename cat cut date dirname env expr grep head id pwd sed sort tail tr uname uniq wc
.for _ember_tool in ${_EMBERBSD_DARWIN_EARLY_TOOLS}
.  if empty(EMBERBSD_DARWIN_NATIVE_TOOLS:M${_ember_tool})
.error "Select accepted parse-time utility ${_ember_tool}"
.  endif
.endfor
.for _ember_tool in ${EMBERBSD_DARWIN_NATIVE_TOOLS}
.  if !defined(EMBERBSD_DARWIN_TOOL.${_ember_tool}) || \
      ${EMBERBSD_DARWIN_TOOL.${_ember_tool}:[#]} != 1 || \
      empty(EMBERBSD_DARWIN_TOOL.${_ember_tool}:M/*)
.error "Supply accepted native utility path for ${_ember_tool}"
.  endif
.endfor
.for _ember_tool in ADMIN INFO
.  if !defined(NATIVE_PKG_${_ember_tool}_CMD) || \
      ${NATIVE_PKG_${_ember_tool}_CMD:[#]} != 1 || \
      empty(NATIVE_PKG_${_ember_tool}_CMD:M/*)
.error "Supply accepted native pkg_${_ember_tool:tl} before package metadata"
.  endif
.endfor

# Preserve the shared work and distfile roots. The coordinator owns concurrency.
_MAKE= ${EMBERBSD_DARWIN_MAKE}
MAKE= ${EMBERBSD_DARWIN_MAKE}
SHELL= ${EMBERBSD_DARWIN_SH}
SH= ${EMBERBSD_DARWIN_SH}
CONFIG_SHELL= ${EMBERBSD_DARWIN_SH}
TOOLS_SHELL= ${EMBERBSD_DARWIN_SH}
# A simple make recipe can bypass its shell. Bind the builtin dispatcher.
EMBERBSD_DARWIN_BUILTIN_SHELL= ${EMBERBSD_DARWIN_SH}
PATH= ${EMBERBSD_DARWIN_UTILITY_BIN}
PKGSRC_COMPILER= gcc
.undef _CC
.undef _GCC_VERSION
.undef _GCC_VERSION_STRING
USE_NATIVE_GCC= yes
USE_PKGSRC_GCC= no
USE_PKGSRC_GCC_RUNTIME= no
CC= ${EMBERBSD_GCC16_SEED_CC}
CXX= ${EMBERBSD_GCC16_SEED_CXX}
CPP= ${EMBERBSD_GCC16_SEED_CPP}
AS= ${EMBERBSD_GCC16_LLVM_MC}
LD= ${EMBERBSD_GCC16_LD64_LLD}
# ld64.lld -v says "compatible with GNU linkers", so libtool's probe takes
# it for GNU ld; configure scripts then pass ELF-only options such as
# --version-script. It is the Mach-O driver: keep libtool on the Darwin path.
CONFIGURE_ENV+= lt_cv_prog_gnu_ld=no lt_cv_prog_gnu_ldcxx=no
AR= ${EMBERBSD_GCC16_AR}
RANLIB= ${EMBERBSD_GCC16_RANLIB}
NM= ${EMBERBSD_GCC16_NM}
STRIP= ${EMBERBSD_GCC16_STRIP}
# Configure scripts and Makefiles also run bare archive and symbol tools.
# The utility PATH has none; expose the selected commands in the tools dir.
.for _ember_tool in ar nm ranlib
TOOLS_CREATE+= ${_ember_tool}
TOOLS_PATH.${_ember_tool}= ${EMBERBSD_GCC16_${_ember_tool:tu}}
.endfor
# mk/tools/strip.mk creates strip, or a no-op for unstripped installs.
TOOLS_PLATFORM.strip= ${EMBERBSD_GCC16_STRIP}
COMPILER_USE_SYMLINKS= no
# Keep the established shared GCC recipe and feature policy.
.include "${.PARSEDIR}/EMBERBSD-DEVELOPMENT-MK.CONF"
MAKE_JOBS= ${EMBERBSD_DARWIN_JOBS}
_EMBERBSD_DARWIN_BOOTSTRAP_POLICY= 1
.endif
