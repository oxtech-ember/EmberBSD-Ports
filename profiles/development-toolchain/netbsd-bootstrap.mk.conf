# Origin: EmberBSD (AI-assisted). Scoped native producer policy.
# Include from the SDK-pinned MAKECONF before pkgsrc host and tool discovery.
.if !defined(_EMBERBSD_NETBSD_BOOTSTRAP_POLICY)
.if ${EMBERBSD_NETBSD_BOOTSTRAP:Uno} != "yes"
.error "Select EMBERBSD_NETBSD_BOOTSTRAP=yes in the initial make command"
.endif

.for _ember_fact in HOST_OS HOST_CPU KERNEL_VERSION PKGSRC_OPSYS_VERSION
.  if !defined(EMBERBSD_NETBSD_${_ember_fact}) || empty(EMBERBSD_NETBSD_${_ember_fact})
.error "Supply accepted host fact EMBERBSD_NETBSD_${_ember_fact}"
.  endif
.endfor
.if ${EMBERBSD_NETBSD_HOST_OS} != "NetBSD" || \
    ${EMBERBSD_NETBSD_HOST_CPU} != "x86_64" || \
    ${EMBERBSD_NETBSD_KERNEL_VERSION} != "11.0" || \
    ${EMBERBSD_NETBSD_PKGSRC_OPSYS_VERSION} != "110000"
.error "This profile requires the accepted native NetBSD 11.0 amd64 host"
.endif
.if ${USE_CROSS_COMPILE:Uno:tl} != "no"
.error "The NetBSD bootstrap profile does not support a cross build"
.endif

# These are accepted host facts, translated to pkgsrc's own machine names.
NATIVE_OPSYS= ${EMBERBSD_NETBSD_HOST_OS}
NATIVE_OS_VERSION= ${EMBERBSD_NETBSD_KERNEL_VERSION}
NATIVE_OPSYS_VERSION= ${EMBERBSD_NETBSD_PKGSRC_OPSYS_VERSION}
OPSYS= ${EMBERBSD_NETBSD_HOST_OS}
OPSYS_VERSION= ${EMBERBSD_NETBSD_PKGSRC_OPSYS_VERSION}
NATIVE_MACHINE_ARCH= x86_64
MACHINE_ARCH= x86_64
MACHINE_PLATFORM= NetBSD-${EMBERBSD_NETBSD_KERNEL_VERSION}-x86_64
NATIVE_MACHINE_PLATFORM= ${MACHINE_PLATFORM}
.SHELL: name=sh path=${EMBERBSD_NETBSD_SH} hasErrCtl=no check="set -e" ignore="set +e" echoFlag=v errFlag=e

.for _ember_path in EMBERBSD_NETBSD_SH EMBERBSD_NETBSD_MAKE \
    EMBERBSD_NETBSD_GMAKE EMBERBSD_NETBSD_UTILITY_BIN GCCBASE LOCALBASE PREFIX \
    WRKOBJDIR DISTDIR PKG_DBDIR PACKAGES
.  if !defined(${_ember_path}) || ${${_ember_path}:[#]} != 1 || \
      empty(${_ember_path}:M/*)
.error "Supply one accepted absolute path for ${_ember_path}"
.  endif
.endfor
.for _ember_command in EMBERBSD_GCC16_SEED_CC EMBERBSD_GCC16_SEED_CXX \
    EMBERBSD_GCC16_SEED_CPP
.  if !defined(${_ember_command}) || empty(${_ember_command}:M/*)
.error "Supply the accepted compiler tuple ${_ember_command}"
.  endif
.endfor
.for _ember_tool in AS LD AR RANLIB NM STRIP
.  if !defined(EMBERBSD_GCC16_${_ember_tool}) || \
      ${EMBERBSD_GCC16_${_ember_tool}:[#]} != 1 || \
      empty(EMBERBSD_GCC16_${_ember_tool}:M/*)
.error "Supply accepted compiler tool EMBERBSD_GCC16_${_ember_tool}"
.  endif
.endfor
.if !defined(EMBERBSD_NETBSD_NATIVE_TOOLS) || empty(EMBERBSD_NETBSD_NATIVE_TOOLS)
.error "Supply the closed accepted native utility roster"
.endif
.for _ember_tool in ${EMBERBSD_NETBSD_NATIVE_TOOLS}
.  if !defined(EMBERBSD_NETBSD_TOOL.${_ember_tool}) || \
      ${EMBERBSD_NETBSD_TOOL.${_ember_tool}:[#]} != 1 || \
      empty(EMBERBSD_NETBSD_TOOL.${_ember_tool}:M/*)
.error "Supply one accepted absolute path for native utility ${_ember_tool}"
.  endif
.endfor
.if !defined(EMBERBSD_NETBSD_JOBS) || ${EMBERBSD_NETBSD_JOBS} != "1"
.error "NetBSD native bootstrap currently requires serial MAKE_JOBS=1"
.endif

# Preserve the accepted seed tuple; the SDK starts every package with it.
_EMBERBSD_NETBSD_INITIAL_MAKE:= ${EMBERBSD_NETBSD_MAKE}
_EMBERBSD_NETBSD_INITIAL_GMAKE:= ${EMBERBSD_NETBSD_GMAKE}
_EMBERBSD_NETBSD_INITIAL_SH:= ${EMBERBSD_NETBSD_SH}

# Pin pkgsrc detection before it can consult /usr/bin or /usr/pkg.
UNAME= ${EMBERBSD_NETBSD_TOOL.uname}
_MAKE= ${EMBERBSD_NETBSD_MAKE}
MAKE= ${EMBERBSD_NETBSD_MAKE}
SHELL= ${EMBERBSD_NETBSD_SH}
SH= ${EMBERBSD_NETBSD_SH}
CONFIG_SHELL= ${EMBERBSD_NETBSD_SH}
TOOLS_SHELL= ${EMBERBSD_NETBSD_SH}
CONFIGURE_ENV+= SHELL=${EMBERBSD_NETBSD_SH:Q}
PATH= ${EMBERBSD_NETBSD_UTILITY_BIN}:${EMBERBSD_NETBSD_MAKE:H}:${EMBERBSD_NETBSD_GMAKE:H}:${GCCBASE}/bin:${LOCALBASE}/bin

# Compiler and builtin detection run before the ordinary tool aliases exist.
.for _ember_tool in awk grep sed
.  if !defined(EMBERBSD_NETBSD_TOOL.${_ember_tool}) || empty(EMBERBSD_NETBSD_TOOL.${_ember_tool})
.error "Supply the accepted parse-time utility ${_ember_tool}"
.  endif
${_ember_tool:tu}:= ${EMBERBSD_NETBSD_TOOL.${_ember_tool}}
TOOLS_${_ember_tool:tu}:= ${EMBERBSD_NETBSD_TOOL.${_ember_tool}}
TOOLS_CMDLINE_${_ember_tool:tu}:= ${EMBERBSD_NETBSD_TOOL.${_ember_tool}}
.endfor

# The accepted SDK owns the native development compiler tuple.
PKGSRC_COMPILER= gcc
GCC_REQD= 16
GCCBASE?= ${LOCALBASE}
.undef _CC
.undef _GCC_VERSION
.undef _GCC_VERSION_STRING
USE_NATIVE_GCC= yes
USE_PKGSRC_GCC= no
USE_PKGSRC_GCC_RUNTIME= no
CC= ${EMBERBSD_GCC16_SEED_CC}
CXX= ${EMBERBSD_GCC16_SEED_CXX}
CPP= ${EMBERBSD_GCC16_SEED_CPP}
AS= ${EMBERBSD_GCC16_AS}
LD= ${EMBERBSD_GCC16_LD}
AR= ${EMBERBSD_GCC16_AR}
RANLIB= ${EMBERBSD_GCC16_RANLIB}
NM= ${EMBERBSD_GCC16_NM}
STRIP= ${EMBERBSD_GCC16_STRIP}
COMPILER_USE_SYMLINKS= no
MAKE_JOBS= ${EMBERBSD_NETBSD_JOBS}

# Reuse pkgsrc's existing source-owned builtin dispatcher and installer.
EMBERBSD_NETBSD_BUILTIN_SHELL= ${EMBERBSD_NETBSD_SH}
.for _ember_builtin in [ echo false test true
TOOLS_PLATFORM.${_ember_builtin}= ${EMBERBSD_NETBSD_BUILTIN_SHELL} ${EMBERBSD_NETBSD_BUILTIN_HELPER} ${_ember_builtin}
.endfor

.if !defined(EMBERBSD_NETBSD_SEED_MAKE_RECIPES)
EMBERBSD_NETBSD_SEED_MAKE_RECIPES= devel/bmake devel/gmake devel/nbpatch \
    pkgtools/bootstrap-mk-files pkgtools/cwrappers pkgtools/digest \
    pkgtools/libnbcompat pkgtools/mktools shells/mksh lang/perl5
EMBERBSD_NETBSD_SEED_GZIP_RECIPES= ${EMBERBSD_NETBSD_SEED_MAKE_RECIPES} \
    archivers/pax net/fetch net/libfetch
.endif

# Keep the shared current development toolchain policy.
.include "${.PARSEDIR}/EMBERBSD-DEVELOPMENT-MK.CONF"

_EMBERBSD_NETBSD_BOOTSTRAP_POLICY= 1
.endif

# Source consumers declare the foundation providers before switching away from
# the accepted bootstrap tuple. Seed recipes keep the accepted host tools.
.if ${EMBERBSD_NETBSD_BOOTSTRAP:Uno} == "yes" && defined(BSD_PKG_MK) && defined(PKGPATH)
.  if !defined(_EMBERBSD_NETBSD_DEPENDENCIES_POLICY)
.    if ${PKGPATH} == "lang/gcc16"
BOOTSTRAP_DEPENDS+= binutils>=2.47:../../devel/binutils
BOOTSTRAP_DEPENDS+= bmake>=20260912:../../devel/bmake
BOOTSTRAP_DEPENDS+= gmake>=4.4.1:../../devel/gmake
BOOTSTRAP_DEPENDS+= mksh>=59b:../../shells/mksh
BOOTSTRAP_DEPENDS+= python315>=3.15:../../lang/python315
BOOTSTRAP_DEPENDS+= gtexinfo>=7.3:../../devel/gtexinfo
BOOTSTRAP_DEPENDS+= bootstrap-mk-files>=20250601:../../pkgtools/bootstrap-mk-files
BOOTSTRAP_DEPENDS+= coreutils>=9.11:../../sysutils/coreutils
BOOTSTRAP_DEPENDS+= findutils>=4.11.0:../../sysutils/findutils
BOOTSTRAP_DEPENDS+= grep>=3.12:../../textproc/grep
BOOTSTRAP_DEPENDS+= gsed>=4.10:../../textproc/gsed
BOOTSTRAP_DEPENDS+= nawk>=20260426:../../lang/nawk
BOOTSTRAP_DEPENDS+= diffutils>=3.12:../../devel/diffutils
BOOTSTRAP_DEPENDS+= pkg_install>=20260227:../../pkgtools/pkg_install
BOOTSTRAP_DEPENDS+= pkg_install-info>=7.3:../../pkgtools/pkg_install-info
BOOTSTRAP_DEPENDS+= digest-[0-9]*:../../pkgtools/digest
BOOTSTRAP_DEPENDS+= pkgconf>=3.0.7:../../devel/pkgconf
BOOTSTRAP_DEPENDS+= perl>=5.44.0:../../lang/perl5
EMBERBSD_NETBSD_SOURCE_TOOLS= gzip gunzip gzcat makeinfo digest gsed pkg-config perl
EMBERBSD_NETBSD_TOOL.makeinfo= ${LOCALBASE}/bin/makeinfo
EMBERBSD_NETBSD_TOOL.digest= ${LOCALBASE}/bin/digest
EMBERBSD_NETBSD_TOOL.gsed= ${LOCALBASE}/bin/gsed
EMBERBSD_NETBSD_TOOL.pkg-config= ${LOCALBASE}/bin/pkg-config
EMBERBSD_NETBSD_TOOL.perl= ${LOCALBASE}/bin/perl
.    endif
.    if ${PKGPATH} == "lang/perl5"
# Perl is built with the accepted initial make tuple. Its runtime shell is
# still a declared source package in the final native bundle.
DEPENDS+= mksh>=59b:../../shells/mksh
PERL_BUILD_SHELL= ${EMBERBSD_NETBSD_SH}
PERL_RUNTIME_SHELL= ${LOCALBASE}/bin/mksh
.    elif ${PKGPATH} == "devel/m4"
DEPENDS+= mksh>=59b:../../shells/mksh
M4_SYSCMD_SHELL= ${LOCALBASE}/bin/mksh
.    endif
.    if empty(EMBERBSD_NETBSD_SEED_MAKE_RECIPES:M${PKGPATH})
.      if ${PKGPATH} != "lang/gcc16"
BOOTSTRAP_DEPENDS+= bmake>=20260912:../../devel/bmake
BOOTSTRAP_DEPENDS+= gmake>=4.4.1:../../devel/gmake
BOOTSTRAP_DEPENDS+= mksh>=59b:../../shells/mksh
BOOTSTRAP_DEPENDS+= bootstrap-mk-files>=20250601:../../pkgtools/bootstrap-mk-files
.      endif
BOOTSTRAP_DEPENDS+= digest-[0-9]*:../../pkgtools/digest
EMBERBSD_NETBSD_SOURCE_TOOLS+= digest
EMBERBSD_NETBSD_TOOL.digest= ${LOCALBASE}/bin/digest
.      if empty(EMBERBSD_NETBSD_SEED_GZIP_RECIPES:M${PKGPATH}) && ${PKGPATH} != "archivers/gzip"
BOOTSTRAP_DEPENDS+= gzip>=1.15:../../archivers/gzip
USE_TOOLS+= gzip gunzip gzcat
EMBERBSD_NETBSD_SOURCE_TOOLS+= gzip gunzip gzcat
.      endif
.    endif
_EMBERBSD_NETBSD_DEPENDENCIES_POLICY= 1
.  endif
.endif

# bsd.prefs.mk can be included again after package Makefile variables have
# changed. Reapply the selected execution tuple on every read; the dependency
# marker above only prevents duplicate graph edges.
.if ${EMBERBSD_NETBSD_BOOTSTRAP:Uno} == "yes" && defined(BSD_PKG_MK) && defined(PKGPATH)
UNAME:= ${EMBERBSD_NETBSD_TOOL.uname}
PATH:= ${EMBERBSD_NETBSD_UTILITY_BIN}:${_EMBERBSD_NETBSD_INITIAL_MAKE:H}:${_EMBERBSD_NETBSD_INITIAL_GMAKE:H}:${GCCBASE}/bin:${LOCALBASE}/bin
.for _ember_tool in awk grep sed
${_ember_tool:tu}:= ${EMBERBSD_NETBSD_TOOL.${_ember_tool}}
TOOLS_${_ember_tool:tu}:= ${EMBERBSD_NETBSD_TOOL.${_ember_tool}}
TOOLS_CMDLINE_${_ember_tool:tu}:= ${EMBERBSD_NETBSD_TOOL.${_ember_tool}}
TOOLS_PLATFORM.${_ember_tool}:= ${EMBERBSD_NETBSD_TOOL.${_ember_tool}}
.endfor
.for _ember_var in AWK GREP SED
.  if defined(TOOLS_CMDLINE_${_ember_var})
${_ember_var}:= ${TOOLS_CMDLINE_${_ember_var}}
.  endif
.endfor
.for _ember_role in ${EMBERBSD_NETBSD_SOURCE_TOOLS}
.  if defined(EMBERBSD_NETBSD_TOOL.${_ember_role}) && \
      !empty(EMBERBSD_NETBSD_TOOL.${_ember_role})
TOOLS_PLATFORM.${_ember_role}:= ${EMBERBSD_NETBSD_TOOL.${_ember_role}}
.  endif
.endfor
.if !empty(EMBERBSD_NETBSD_SOURCE_TOOLS:Mbison-yacc)
TOOLS_PLATFORM.bison-yacc:= ${LOCALBASE}/bin/bison -y
.endif
PKGSRC_COMPILER:= gcc
GCC_REQD:= 16
USE_NATIVE_GCC:= yes
USE_PKGSRC_GCC:= no
USE_PKGSRC_GCC_RUNTIME:= no
CC:= ${EMBERBSD_GCC16_SEED_CC}
CXX:= ${EMBERBSD_GCC16_SEED_CXX}
CPP:= ${EMBERBSD_GCC16_SEED_CPP}
AS:= ${EMBERBSD_GCC16_AS}
LD:= ${EMBERBSD_GCC16_LD}
AR:= ${EMBERBSD_GCC16_AR}
RANLIB:= ${EMBERBSD_GCC16_RANLIB}
NM:= ${EMBERBSD_GCC16_NM}
STRIP:= ${EMBERBSD_GCC16_STRIP}
TOOLS_PLATFORM.cc:= ${EMBERBSD_GCC16_SEED_CC}
TOOLS_PLATFORM.gcc:= ${EMBERBSD_GCC16_SEED_CC}
TOOLS_PLATFORM.c++:= ${EMBERBSD_GCC16_SEED_CXX}
TOOLS_PLATFORM.g++:= ${EMBERBSD_GCC16_SEED_CXX}
TOOLS_PLATFORM.cpp:= ${EMBERBSD_GCC16_SEED_CPP}
TOOLS_PLATFORM.as:= ${EMBERBSD_GCC16_AS}
TOOLS_PLATFORM.ld:= ${EMBERBSD_GCC16_LD}
TOOLS_PLATFORM.ar:= ${EMBERBSD_GCC16_AR}
TOOLS_PLATFORM.ranlib:= ${EMBERBSD_GCC16_RANLIB}
TOOLS_PLATFORM.nm:= ${EMBERBSD_GCC16_NM}
TOOLS_PLATFORM.strip:= ${EMBERBSD_GCC16_STRIP}
_MAKE:= ${_EMBERBSD_NETBSD_INITIAL_MAKE}
MAKE:= ${_EMBERBSD_NETBSD_INITIAL_MAKE}
EMBERBSD_NETBSD_MAKE:= ${_EMBERBSD_NETBSD_INITIAL_MAKE}
EMBERBSD_NETBSD_GMAKE:= ${_EMBERBSD_NETBSD_INITIAL_GMAKE}
EMBERBSD_NETBSD_SH:= ${_EMBERBSD_NETBSD_INITIAL_SH}
SHELL:= ${_EMBERBSD_NETBSD_INITIAL_SH}
SH:= ${_EMBERBSD_NETBSD_INITIAL_SH}
CONFIG_SHELL:= ${_EMBERBSD_NETBSD_INITIAL_SH}
TOOLS_SHELL:= ${_EMBERBSD_NETBSD_INITIAL_SH}
EMBERBSD_NETBSD_BUILTIN_SHELL:= ${_EMBERBSD_NETBSD_INITIAL_SH}
.SHELL: name=sh path=${_EMBERBSD_NETBSD_INITIAL_SH} hasErrCtl=no check="set -e" ignore="set +e" echoFlag=v errFlag=e

.if empty(EMBERBSD_NETBSD_SEED_MAKE_RECIPES:M${PKGPATH})
_MAKE:= ${LOCALBASE}/bin/bmake
MAKE:= ${LOCALBASE}/bin/bmake
EMBERBSD_NETBSD_MAKE:= ${LOCALBASE}/bin/bmake
EMBERBSD_NETBSD_GMAKE:= ${LOCALBASE}/bin/gmake
EMBERBSD_NETBSD_SH:= ${LOCALBASE}/bin/mksh
SHELL:= ${LOCALBASE}/bin/mksh
SH:= ${LOCALBASE}/bin/mksh
CONFIG_SHELL:= ${LOCALBASE}/bin/mksh
TOOLS_SHELL:= ${LOCALBASE}/bin/mksh
EMBERBSD_NETBSD_BUILTIN_SHELL:= ${LOCALBASE}/bin/mksh
EMBERBSD_NETBSD_BUILTIN_HELPER:= ${LOCALBASE}/libexec/emberbsd-darwin-builtin.sh
.SHELL: name=sh path=${LOCALBASE}/bin/mksh hasErrCtl=no check="set -e" ignore="set +e" echoFlag=v errFlag=e
.endif
TOOLS_PLATFORM.make:= ${MAKE}
TOOLS_PLATFORM.bmake:= ${MAKE}
TOOLS_PLATFORM.gmake:= ${EMBERBSD_NETBSD_GMAKE} SHELL=${EMBERBSD_NETBSD_SH}
TOOLS_PLATFORM.sh:= ${EMBERBSD_NETBSD_SH}
.endif
