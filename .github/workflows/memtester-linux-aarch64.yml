# Origin: EmberBSD, AI-assisted by OpenAI Codex (GPT-6).
name: memtester Linux AArch64 diagnostic

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/memtester-linux-aarch64.yml'
      - 'pkgsrc/sysutils/memtester/**'
      - 'probes/memtester/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container:
      options: --ulimit memlock=-1:-1
      # Official GCC 16.2.0 linux/arm64 image; no emulation or target-board build.
      image: gcc@sha256:b89e1771f0ac16e3769dd351ea8e07a6676aa690a76339c16e36c761eaaaf0f9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare diagnostic tools
        run: |
          test "$(gcc -dumpfullversion)" = 16.2.0
          test "$(uname -m)" = aarch64
          apt-get update
          apt-get install -y --no-install-recommends python3 ca-certificates curl patch valgrind libc6-dbg
      - name: Check real source and build the diagnostic candidate
        env:
          GCC_IMAGE: gcc@sha256:b89e1771f0ac16e3769dd351ea8e07a6676aa690a76339c16e36c761eaaaf0f9
        run: |
          python3 probes/memtester/linux-candidate.py \
            --work "$RUNNER_TEMP/memtester-linux" \
            --output "$GITHUB_WORKSPACE/memtester-linux-artifact"
      - name: Upload the verified Linux diagnostic
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memtester-linux-aarch64-${{ github.sha }}
          path: memtester-linux-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
